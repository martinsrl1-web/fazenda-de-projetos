<style>
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6876; --line:#d6dde4;
  --accent:#312B50; --accent-ink:#ffffff; --accent-soft:#e8e6f0; --marca:#913032; --navy:#312B50;
  --ok:#1d7a4a; --ok-soft:#e2f3ea;
  --bad:#b3261e; --bad-soft:#fbe4e2;
  --near:#8a6d00; --near-soft:#fbf3cf;
  --gone:#8b95a0; --gone-soft:#eceff2;
  --f-display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#11161c; --surface:#1a2129; --ink:#e7edf3; --muted:#9aa7b4; --line:#2c3743;
  --accent:#b7b0e6; --accent-ink:#17142a; --accent-soft:#272340; --marca:#d9686b; --navy:#312B50;
  --ok:#5fc890; --ok-soft:#16301f;
  --bad:#ff8a80; --bad-soft:#3a1c1a;
  --near:#e5c64a; --near-soft:#352e0e;
  --gone:#7c8792; --gone-soft:#222a33;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:17px; line-height:1.5}
.wrap{max-width:1200px; margin:0 auto; padding:20px max(16px, env(safe-area-inset-right,0px)) 96px max(16px, env(safe-area-inset-left,0px))}
header.top{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap}
h1,h2,h3{font-family:var(--f-display); text-wrap:balance; margin:0; letter-spacing:-.01em}
h1{font-family:"Big Shoulders Display", var(--f-display); font-size:2.1rem; font-weight:800; text-transform:uppercase; letter-spacing:.01em}
.marca-topo{height:8px; background:linear-gradient(90deg, var(--marca) 0 34%, var(--navy) 34% 100%)}
.cab-marca{display:flex; align-items:center; gap:14px}
.cab-marca img{width:64px; height:64px; flex:none}
.cab-marca .eyebrow{color:var(--marca)}
button.primary{box-shadow:inset 0 -3px 0 var(--marca)}
nav.secs button.cur{box-shadow:inset 3px 0 0 var(--marca)}
@media (max-width:520px){ .cab-marca img{width:48px; height:48px} h1{font-size:1.7rem} }
h2{font-size:1.35rem; font-weight:800}
h3{font-size:1.02rem; font-weight:700}
.eyebrow{font-family:var(--f-mono); font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.ruler{height:14px; margin:10px 0 18px; color:var(--line);
  background:repeating-linear-gradient(90deg, currentColor 0 1.5px, transparent 1.5px 50px) bottom/100% 14px no-repeat,
             repeating-linear-gradient(90deg, currentColor 0 1px, transparent 1px 10px) bottom/100% 7px no-repeat;
  border-bottom:1.5px solid currentColor}
.muted{color:var(--muted)} .small{font-size:.88rem}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px}
button,.btn{font:inherit; font-weight:700; border-radius:12px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink);
  padding:10px 16px; cursor:pointer; min-height:44px; display:inline-flex; align-items:center; justify-content:center; gap:8px; text-decoration:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
button.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
button.ghost{border-color:transparent; background:transparent; color:var(--accent); padding-inline:8px}
button.danger{color:var(--bad); border-color:var(--bad-soft)}
button.mini{min-height:34px; padding:4px 10px; font-size:.85rem; border-radius:9px}
button:disabled{opacity:.5; cursor:not-allowed}
input[type=text],input[type=date],textarea,select{font:inherit; width:100%; padding:10px 12px; border-radius:10px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink)}
textarea{min-height:170px; line-height:1.55; resize:vertical}
textarea.short{min-height:90px}
label.f{display:block; font-weight:700; margin:14px 0 6px}
label.f .muted{font-weight:400}
.hint{font-size:.85rem; color:var(--muted); margin:4px 0 0}
.note{background:var(--accent-soft); border-radius:12px; padding:12px 14px; font-size:.95rem}
.note p{margin:.3em 0}
.note ul{margin:.3em 0; padding-left:1.2em}
.toolbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.saved{font-family:var(--f-mono); font-size:.75rem; color:var(--muted)}
.progresso{position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--accent); color:#fff; padding:8px max(16px, env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)); box-shadow:0 -4px 14px rgba(0,0,0,.15)}
.progresso .pg-txt{max-width:1200px; margin:0 auto 6px; font-size:.9rem; display:flex; gap:6px; align-items:baseline; flex-wrap:wrap}
.progresso .pg-txt b{font-size:1.15rem}
.progresso .pg-det{margin-left:auto; opacity:.85; font-size:.8rem}
.progresso .pg-trilho{max-width:1200px; margin:0 auto; height:10px; border-radius:6px; background:rgba(255,255,255,.22); overflow:hidden}
.progresso .pg-barra{height:100%; width:0; background:var(--marca); border-radius:6px; transition:width .4s}
.progresso.cheio .pg-barra{background:#2fa36b}
@media (max-width:560px){ .progresso .pg-det{margin-left:0; width:100%} }
#bNuvem{background:var(--marca); border-color:var(--marca); color:#fff; font-weight:600}

/* layout com menu lateral */
.layout{display:grid; grid-template-columns:290px minmax(0,1fr); gap:18px; align-items:start}
nav.secs{position:sticky; top:12px; max-height:calc(100vh - 100px); overflow:auto; padding:10px}
nav.secs .grp{font-family:var(--f-mono); font-size:.68rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:12px 8px 4px}
nav.secs button{width:100%; justify-content:space-between; min-height:36px; padding:6px 10px; border:none; border-radius:9px; font-weight:500; font-size:.9rem; text-align:left; background:transparent}
nav.secs button.cur{background:var(--accent-soft); color:var(--accent); font-weight:700}
.st{font-family:var(--f-mono); font-size:.72rem; font-weight:700; padding:2px 7px; border-radius:99px; white-space:nowrap; flex:none}
.st.ok{background:var(--ok-soft); color:var(--ok)}
.st.bad{background:var(--bad-soft); color:var(--bad)}
.st.mid{background:var(--near-soft); color:var(--near)}
.st.nada{background:var(--gone-soft); color:var(--gone)}
.mobnav{display:none}
@media (max-width:860px){ .layout{grid-template-columns:minmax(0,1fr)} nav.secs{display:none} .mobnav{display:block; margin-bottom:12px} }

.cols{display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:16px; align-items:start}
@media (max-width:1100px){ .cols{grid-template-columns:minmax(0,1fr)} }
.sug{position:sticky; top:12px}
.sug h3{margin-bottom:8px}
.sug ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}

.sug li b.ic{font-size:1rem; line-height:1.3}
.sug li.erro{background:var(--bad-soft); color:var(--bad)}
.sug li.aviso{background:var(--near-soft); color:var(--near)}
.sug li.ok{background:var(--ok-soft); color:var(--ok)}
.sug li .tr{grid-column:2; font-family:var(--f-mono); font-size:.78rem; opacity:.9; overflow-wrap:anywhere}
.tudook{background:var(--ok-soft); color:var(--ok); border-radius:12px; padding:14px; font-weight:700; text-align:center; font-size:1.05rem}

/* tabelas editáveis */
.tablewrap{overflow-x:auto; border:1px solid var(--line); border-radius:12px; background:var(--surface)}
table.ed{border-collapse:collapse; width:100%; font-size:.9rem; min-width:560px}
table.ed th{font-family:var(--f-display); font-size:.75rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; text-align:left; padding:8px; border-bottom:1px solid var(--line)}
table.ed td{padding:4px; border-bottom:1px solid var(--line); vertical-align:top}
table.ed td input,table.ed td select{padding:7px 8px; border-radius:8px; font-size:.9rem}
table.ed td.x{width:36px}
table.ed tr.tot td{font-weight:700; font-family:var(--f-mono); padding:10px 8px}
.bloco{border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; margin:12px 0; background:var(--bg)}
.bloco .cab{display:flex; justify-content:space-between; align-items:center; gap:8px}
.foto{display:grid; grid-template-columns:120px 1fr; gap:12px; align-items:start; margin-top:10px}
.foto .th{width:120px; height:90px; border-radius:8px; border:1.5px dashed var(--line); display:grid; place-items:center; overflow:hidden; color:var(--muted); font-size:.75rem; text-align:center; background:var(--surface)}
.foto .th img{width:100%; height:100%; object-fit:cover}
@media (max-width:520px){ .foto{grid-template-columns:1fr} .row[style*=nowrap]{flex-wrap:wrap!important} }
.navbtns{display:flex; justify-content:space-between; gap:10px; margin-top:18px}
.cnt{font-family:var(--f-mono); font-size:.75rem; color:var(--muted); text-align:right; margin-top:4px}
.toast{position:fixed; left:50%; transform:translateX(-50%); z-index:50; bottom:calc(84px + env(safe-area-inset-bottom,0px)); background:var(--ink); color:var(--bg);
  padding:10px 16px; border-radius:99px; font-weight:700; font-size:.9rem; z-index:20; max-width:90vw; text-align:center}
.resumo-grid{display:grid; gap:8px}
.resumo-grid button{justify-content:space-between; font-weight:500; text-align:left}
dialog{border:none; border-radius:16px; padding:20px; max-width:520px; background:var(--surface); color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.4)}
</style>
</head>
<body>
<div class="marca-topo"></div>
<div class="wrap">
  <header class="top">
    <div class="cab-marca"><img src="../marca/ceep-cor.png" alt="CEEP Erotides Ângelo Nichele – Fazenda Rio Grande"><div>
      <div class="eyebrow"><a href="../tccs/" style="color:inherit">TCC – CEEP FRG</a> · Técnico em Mecânica</div>

      <button class="mini" id="bNuvem" title="Guardar o trabalho na nuvem para abrir em qualquer computador">☁ Nuvem</button>

</div>

<div class="progresso" id="progresso" role="status" aria-live="polite"><div class="pg-txt"><b id="pgPct">0%</b> <span id="pgRot">do TCC pronto</span><span class="pg-det" id="pgDet"></span></div><div class="pg-trilho"><div class="pg-barra" id="pgBarra"></div></div></div>
<dialog id="dlg"><div id="dlgBody"></div><div class="row" style="justify-content:flex-end;margin-top:16px" id="dlgBtns"></div></dialog>

<script src="config.js"></script>
<script src="../tccs/nuvem.js"></script>
<script src="../tccs/revisor.js"></script>

<script>
'use strict';
/* =====================================================================
   ESTADO, SALVAMENTO E IMAGENS
   ===================================================================== */
const CHAVE = 'tcc-mecanica-v1';
const ANO = '2026';
// termos típicos de cada tipo de equipamento (uso interno: avisa quando o texto parece ser de outro trabalho)
const TEMAS = [['macaco', 'cilindro hidráulico', 'jacaré'], ['cana-de-açúcar', 'moenda', 'caldo de cana', 'moedor'], ['serra fita', 'serra de fita', 'mdf'],
  ['dobradeira', 'dobramento'], ['couro', 'estampagem', 'premza'], ['ponte levadiça', 'levadiça'], ['vaso de pressão'], ['bebedouro', 'galão']];
const semAcento = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
function estadoInicial() {
  return {
    equipamento: '', titulo: '', subtitulo: '', curso: 'Curso Técnico em Mecânica', orientador: 'Prof. Egon Henrique Felício', ano: ANO,
    integrantes: ['', '', '', '', '', ''], banca: [{ nome: '', inst: '' }, { nome: '', inst: '' }],
    dedicatoria: '', agradecimentos: '', resumo: '', palavras: '',
    contexto: '', problema: '', justificativa: '', objGeral: '', objEsp: ['', '', '', ''],
    fund: [{ titulo: '', texto: '' }, { titulo: '', texto: '' }, { titulo: '', texto: '' }],
    metodo: 'Este trabalho caracteriza-se como uma pesquisa aplicada, pois buscou resolver um problema prático por meio da construção de um equipamento. Quanto aos procedimentos, envolveu pesquisa bibliográfica, para reunir a base teórica, e parte experimental, com a fabricação e os testes do protótipo. O desenvolvimento ocorreu no laboratório de mecânica do CEEP Erotides Ângelo Nichele.',
    etapas: [['Pesquisa', '', ''], ['Concepção e esboços', '', ''], ['Modelagem em CAD', '', ''], ['Dimensionamento', '', ''], ['Materiais', '', ''], ['Fabricação e montagem', '', ''], ['Testes', '', '']],
    instrumentos: '',
    produtos: [['', '', '', '', ''], ['', '', '', '', '']], diferencial: '', evolucao: '',
    figFunc: { img: '', legenda: '', fonte: '' }, funcionamento: '', modelagem: '', figCad: { img: '', legenda: '', fonte: '' },
    materiais: [['', '', '', '', ''], ['', '', '', '', ''], ['', '', '', '', '']],
    dimIntro: '', calculos: [{ titulo: '', dados: '', formula: '', variaveis: '', substituicao: '', significado: '' }],
    construcao: [{ texto: '', foto: { img: '', legenda: '', fonte: '' } }, { texto: '', foto: { img: '', legenda: '', fonte: '' } }, { texto: '', foto: { img: '', legenda: '', fonte: '' } }],
    dificuldades: [['', '', '', ''], ['', '', '', '']], dificuldadesTexto: '',
    custos: [['', '', '', ''], ['', '', '', ''], ['', '', '', '']], custosTexto: '',
    riscos: [['', '', '', ''], ['', '', '', '']], segurancaTexto: '', epis: '', sobras: [], galeria: [], importadoDe: '',
    testeProc: '', medida1: '', medida2: '', testes: [['', '', ''], ['', '', ''], ['', '', '']], figTeste: { img: '', legenda: '', fonte: '' }, testeAnalise: '',
    discussao: [], discussaoTexto: '', conclusao: '',
    referencias: [{ tipo: 'livro' }],
    desenhos: [{ img: '', legenda: '', fonte: '' }], naoUsouIA: false, ia: [['', '', '', '']], tarefas: [], manual: '',
    siglas: [['ABNT', 'Associação Brasileira de Normas Técnicas'], ['CAD', 'Desenho assistido por computador (Computer-Aided Design)'], ['CEEP', 'Centro Estadual de Educação Profissional'], ['NR', 'Norma Regulamentadora']],
  };
}
let S;
try { S = Object.assign(estadoInicial(), JSON.parse(localStorage.getItem(CHAVE) || 'null') || {}); } catch (e) { S = estadoInicial(); }
let salvarT = null;
function salvar() {
  clearTimeout(salvarT);
  if (window.NuvemTCC) NuvemTCC.mudou();
  document.getElementById('salvo').textContent = 'Salvando…';
  salvarT = setTimeout(() => {
    try { localStorage.setItem(CHAVE, JSON.stringify(S)); document.getElementById('salvo').textContent = 'Salvo neste navegador ✓'; }
    catch (e) { document.getElementById('salvo').textContent = 'Não foi possível salvar: use "Salvar cópia"'; }
  }, 300);
}

// imagens no IndexedDB (fotos são grandes demais para o localStorage)
const IDB = (() => {
  let dbp = null;
  const abrir = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('tcc-mecanica-img', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('img');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const op = (modo, f) => abrir().then(db => new Promise((res, rej) => {
    const t = db.transaction('img', modo); const s = t.objectStore('img'); const r = f(s);
    t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error);
  }));
  return {
    put: (id, v) => op('readwrite', s => s.put(v, id)),
    get: id => op('readonly', s => s.get(id)),
    del: id => op('readwrite', s => s.delete(id)),
    keys: () => op('readonly', s => s.getAllKeys()),
    clear: () => op('readwrite', s => s.clear()),
  };
})();
const urlCache = {};
async function urlImg(id) {
  if (!id) return '';
  if (urlCache[id]) return urlCache[id];
  const v = await IDB.get(id).catch(() => null);
  if (!v) return '';
  return (urlCache[id] = URL.createObjectURL(new Blob([v.data], { type: v.type === 'png' ? 'image/png' : 'image/jpeg' })));
}
function reduzirImagem(file) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file); const im = new Image();
    im.onload = () => {
      const k = Math.min(1, 1400 / Math.max(im.naturalWidth, im.naturalHeight));
      const w = Math.round(im.naturalWidth * k), h = Math.round(im.naturalHeight * k);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(im, 0, 0, w, h);
      URL.revokeObjectURL(u);
      c.toBlob(b => b ? b.arrayBuffer().then(buf => res({ data: buf, w, h, type: 'jpg' })) : rej(new Error('img')), 'image/jpeg', 0.82);
    };
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('Não consegui abrir essa imagem. Use JPG ou PNG.')); };
    im.src = u;
  });
}
const novoId = () => 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* =====================================================================
   VERIFICAÇÕES (sem IA: regras)
   ===================================================================== */
const L = s => String(s == null ? '' : s).trim();
const tem = s => L(s) !== '';
const palavras = s => (L(s).match(/[A-Za-zÀ-ÿ0-9][A-Za-zÀ-ÿ0-9'’-]*/g) || []).length;
const temNumero = s => /\d/.test(s || '');
const E = (m, t) => ({ n: 'erro', m, t }), A = (m, t) => ({ n: 'aviso', m, t }), OK = m => ({ n: 'ok', m });
const RX = {
  marca: /\[[^\]]*\]|EDIT[ÁA]VEL|\bINSERIR\b|\bPREENCHER\b|como (você|vc) pediu|na vers[ãa]o final|voc[êe] est[áa] criando|ORIENTA[ÇC][ÃA]O|lorem ipsum|aqui est[áa] (o|a|um|uma)|espero que (isso|isto) ajude/i,
  emoji: /[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B50}]/u,
  alheio: /vaso de press[ãa]o|cama[çc]ari|teste hidrost[áa]tico|o acesso, a perman[êe]ncia|\bbacharel|\bgradua[çc][ãa]o\b|engenharia mec[âa]nica|universidade|monografia|polo petroqu[íi]mico/i,
  futuro: /(?<![A-Za-zÀ-ÿ])(será|serão|seremos|iremos|vamos|irá|irão|deverá|deverão|poderá|poderão|pretendemos|pretende-se|faremos)(?![A-Za-zÀ-ÿ])/i,
  futuro2: /(?<![A-Za-zÀ-ÿ])[a-zà-ÿ]{3,}(?:ar|er|ir)(?:á|ão|emos)(?![A-Za-zÀ-ÿ])/i,
  forte: /comprovam?|comprovad[oa]s?|perfeit[ao]s?|perfeitamente|100 ?%|\bgarant(e|em|imos|ir)\b|\belimina|revolucion|inovador|exponencial|indispens[áa]vel|totalmente|rigorosamente|absolutamente|o melhor do mercado|m[áa]xima efici/i,
  eu: /(?<![A-Za-zÀ-ÿ])(eu|meu|minha|meus|minhas|comigo)(?![A-Za-zÀ-ÿ])/i,
  informal: /(?<![A-Za-zÀ-ÿ])(vc|vcs|pq|tb|tbm|né|tipo assim|a gente|pra|pro|coisa|coisas|muito top|show de bola)(?![A-Za-zÀ-ÿ])/i,
  decimal: /\b\d+\.\d+\s?(mm|cm|m|kg|g|N|kN|N·m|Nm|rpm|W|V|A|MPa|bar|s|min)\b/,
  colado: /\b\d+(?:,\d+)?(mm|cm|kg|kN|rpm|MPa|Nm|N|W|V)\b/,
  citacao: /\([A-ZÀ-Ý][A-ZÀ-Ý\s.&;-]+,\s*\d{4}[a-z]?(?:,\s*p\.\s*\d+)?\)|[A-ZÀ-Ý][a-zà-ÿ]+(?:\s+et al\.|\s+e\s+[A-ZÀ-Ý][a-zà-ÿ]+)?\s*\(\d{4}/,
  loja: /amazon\.|mercadolivre\.|shopee\.|magazineluiza\.|americanas\./i,
};
const trecho = (s, rx) => { const m = String(s).match(rx); return m ? '“' + m[0] + '”' : ''; };
// análise de um texto
function analisa(texto, o = {}) {
  const r = [];
  const s = L(texto);
  if (!s) return r;
  if (RX.marca.test(s)) r.push(E('Sobrou marca de modelo ou de IA. Apague e escreva com os dados do grupo.', trecho(s, RX.marca)));
  if (RX.emoji.test(s)) r.push(E('Tem emoji no texto. Trabalho acadêmico não usa emoji.', trecho(s, RX.emoji)));
  if (RX.alheio.test(s)) r.push(E('Esse trecho parece ter vindo de outro trabalho (engenharia, outro tema). Escreva o texto do grupo.', trecho(s, RX.alheio)));
  const proprio = semAcento(S.equipamento + ' ' + S.titulo);
  if (L(proprio) && !o.semProjeto) {
    const sa = semAcento(s);
    for (const tema of TEMAS) {
      if (tema.some(c => proprio.includes(semAcento(c)))) continue;
      const ach = tema.find(c => sa.includes(semAcento(c)));
      if (ach) { r.push(A(`O texto fala de “${ach}”, que não é o equipamento de vocês. Confiram se esse trecho não veio de outro trabalho.`)); break; }
    }
  }
  if (o.passado) {
    if (RX.futuro.test(s)) r.push(E('Verbo no futuro. Esta parte conta o que já foi feito: escreva no passado (“foi feito”, “foram medidos”).', trecho(s, RX.futuro)));
    else if (RX.futuro2.test(s)) r.push(A('Parece ter verbo no futuro. Confira se o texto está no passado.', trecho(s, RX.futuro2)));
  }
  if (RX.forte.test(s) && !o.semForte) r.push(A('Afirmação muito forte. Só mantenha se vocês mediram e têm o número para provar.', trecho(s, RX.forte)));
  if (RX.eu.test(s)) r.push(A('O TCC é do grupo: evite “eu”, “meu”, “minha”.', trecho(s, RX.eu)));
  if (RX.informal.test(s)) r.push(A('Linguagem informal. Troque por uma forma mais formal.', trecho(s, RX.informal)));
  if (RX.decimal.test(s)) r.push(A('Em português, o decimal usa vírgula: 0,60 m (e não 0.60 m).', trecho(s, RX.decimal)));
  if (RX.colado.test(s)) r.push(A('Deixe um espaço entre o número e a unidade: 10 mm, 200 N.', trecho(s, RX.colado)));
  const frases = s.split(/(?<=[.!?])\s+/).filter(f => palavras(f) > 45);
  if (frases.length) r.push(A(`Há ${frases.length === 1 ? 'uma frase muito longa' : frases.length + ' frases muito longas'} (mais de 45 palavras). Divida em frases menores.`, '“' + frases[0].slice(0, 70) + '…”'));
  if (o.citacao === 'exige' && !RX.citacao.test(s)) r.push(E('Falta citação. Indique de onde veio a informação: (SOBRENOME, ano) ou Sobrenome (ano).'));
  if (o.citacao === 'sugere' && !RX.citacao.test(s)) r.push(A('Que tal citar um autor? Ex.: (MELCONIAN, 2012) ou Segundo Norton (2013).'));
  if (o.min && palavras(s) < o.min) r.push(A(`Texto curto (${palavras(s)} palavras). O ideal é pelo menos ${o.min}.`));
  return r;
}
const vazioTab = t => !(t || []).some(r => r && r.some(c => tem(c)));
const linhasCheias = t => (t || []).filter(r => r && r.some(c => tem(c)));

/* =====================================================================
   STATUS
   ===================================================================== */
function status(s) {
  if (s.entrega) return null;
  if (s.vazio && s.vazio()) return { c: s.opc ? 'nada' : 'nada', txt: s.opc ? 'opcional' : 'vazio', erros: 0, avisos: 0, itens: [] };
  const itens = s.check ? s.check() : [];
  const erros = itens.filter(i => i.n === 'erro').length, avisos = itens.filter(i => i.n === 'aviso').length;
  if (erros) return { c: 'bad', txt: `✗ ${erros}`, erros, avisos, itens };
  if (avisos) return { c: 'mid', txt: `! ${avisos}`, erros, avisos, itens };
  return { c: 'ok', txt: '✓', erros, avisos, itens };
}

/* =====================================================================
   INTERFACE
   ===================================================================== */
let atual = SEC[0].id;
try { const u = localStorage.getItem(CHAVE + '-sec'); if (u && SEC.find(s => s.id === u)) atual = u; } catch (e) {}
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }
function dialogo(html, botoes) {
  return new Promise(res => {
    const d = $('#dlg'); $('#dlgBody').innerHTML = html; const b = $('#dlgBtns'); b.innerHTML = '';
    botoes.forEach(([txt, val, cls]) => { const x = document.createElement('button'); x.textContent = txt; if (cls) x.className = cls; x.onclick = () => { d.close(); res(val); }; b.appendChild(x); });
    d.showModal();
  });
}

function desenharNav() {
  const nav = $('#nav'), sel = $('#selSec');
  let h = '', g = '', o = '';
  SEC.forEach(s => {
    if (s.grp !== g) { g = s.grp; h += `<div class="grp">${esc(g)}</div>`; }
    const st = status(s);
    h += `<button data-s="${s.id}" class="${s.id === atual ? 'cur' : ''}"><span>${esc(s.nome)}</span>${st ? `<span class="st ${st.c}">${st.txt}</span>` : '<span class="st ok">⬇</span>'}</button>`;
    o += `<option value="${s.id}" ${s.id === atual ? 'selected' : ''}>${esc(s.nome)}${st ? ' — ' + st.txt : ''}</option>`;
  });
  nav.innerHTML = h; sel.innerHTML = o;
  desenharProgresso();
}
/* barra de progresso: partes obrigatórias preenchidas (✓ conta 100%, ! conta 90%, ✗ conta 60%) */
function desenharProgresso() {
  const partes = SEC.filter(s => !s.entrega && !s.opc);
  let soma = 0, cheias = 0, corrigir = 0;
  const modelo = estadoInicial();
  partes.forEach(s => { const st = status(s); if (!st || st.c === 'nada') return;
    if (s.id === 'metodo' && typeof S.metodo === 'string' && S.metodo === modelo.metodo) return; // texto-modelo ainda não editado
    cheias++;
    if (st.c === 'ok') soma += 1; else if (st.c === 'mid') soma += 0.9; else { soma += 0.6; corrigir++; } });
  const pct = partes.length ? Math.round(100 * soma / partes.length) : 0;
  $('#pgPct').textContent = pct + '%';
  $('#pgBarra').style.width = pct + '%';
  $('#progresso').classList.toggle('cheio', pct === 100);
  $('#pgRot').textContent = pct === 100 ? 'do TCC pronto! Já podem gerar o Word e enviar.' : 'do TCC pronto';
  $('#pgDet').textContent = cheias + ' de ' + partes.length + ' partes preenchidas' + (corrigir ? ' · ' + corrigir + (corrigir === 1 ? ' com correção obrigatória' : ' com correções obrigatórias') : '');
}

  salvar(); desenhar();
  // relatório
  const secs = [...new Set(Object.keys(res.relatorio).map(k => SEC_DO_RELAT[k]).filter(Boolean))];
  const nomes = SEC.filter(s => secs.includes(s.id)).map(s => `<li>${esc(s.nome)}</li>`).join('');
  const naoAplic = chaves.filter(k => !aplicados.has(k)).length;
  await dialogo(`<p><b>Pronto! O arquivo foi lido.</b></p>
    <p>Partes preenchidas com o que vocês já tinham:</p><ul style="margin:.3em 0;padding-left:1.2em">${nomes || '<li>nenhuma</li>'}</ul>
    ${fotos ? `<p>${fotos} imagem(ns) colocada(s) nas partes certas.</p>` : ''}
    ${naoAplic ? `<p class="small">${naoAplic} parte(s) do arquivo não foram usadas porque já estavam preenchidas aqui.</p>` : ''}
    ${res.sobras.length || fotosSobra ? `<p class="small">${res.sobras.length ? res.sobras.length + ' trecho(s)' : ''}${res.sobras.length && fotosSobra ? ' e ' : ''}${fotosSobra ? fotosSobra + ' imagem(ns)' : ''} não tinham lugar certo. ${res.sobras.length ? 'Os trechos estão listados em “Dados do grupo”. ' : ''}${fotosSobra ? 'As imagens ficam guardadas: em qualquer figura, use “Usar imagem do arquivo enviado”.' : ''}</p>` : ''}
    <p><b>Agora:</b> confiram cada parte. As que estão com <span style="color:var(--bad)">✗</span> precisam de correção.</p>
    <p class="small">Preencham também os dados do grupo (nomes e título).</p>`, [['Ver a situação de cada parte', true, 'primary']]);
  ir('entrega');
}

// garante tamanhos mínimos (cópias antigas)
['integrantes'].forEach(k => { while (S[k].length < 6) S[k].push(''); });
if (!Array.isArray(S.tarefas)) S.tarefas = [];
if (!Array.isArray(S.discussao)) S.discussao = [];
if (!Array.isArray(S.galeria)) S.galeria = [];
if (!Array.isArray(S.sobras)) S.sobras = [];
desenhar();
window.addEventListener('load', () => { if (atual === 'referencias') desenhar(); });
</script>
</body>
