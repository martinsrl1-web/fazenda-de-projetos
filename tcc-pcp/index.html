<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Assistente do TCC – Técnico em PCP</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6876; --line:#d6dde4;
  --accent:#1f5fa8; --accent-ink:#ffffff; --accent-soft:#e3edf8;
  --ok:#1d7a4a; --ok-soft:#e2f3ea;
  --bad:#b3261e; --bad-soft:#fbe4e2;
  --near:#8a6d00; --near-soft:#fbf3cf;
  --gone:#8b95a0; --gone-soft:#eceff2;
  --f-display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#11161c; --surface:#1a2129; --ink:#e7edf3; --muted:#9aa7b4; --line:#2c3743;
  --accent:#6aa6ec; --accent-ink:#0b1622; --accent-soft:#1d2d40;
  --ok:#5fc890; --ok-soft:#16301f;
  --bad:#ff8a80; --bad-soft:#3a1c1a;
  --near:#e5c64a; --near-soft:#352e0e;
  --gone:#7c8792; --gone-soft:#222a33;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:17px; line-height:1.5}
.wrap{max-width:1200px; margin:0 auto; padding:20px max(16px, env(safe-area-inset-right,0px)) 48px max(16px, env(safe-area-inset-left,0px))}
header.top{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap}
h1,h2,h3{font-family:var(--f-display); text-wrap:balance; margin:0; letter-spacing:-.01em}
h1{font-size:1.65rem; font-weight:800}
h2{font-size:1.35rem; font-weight:800}
h3{font-size:1.02rem; font-weight:700}
.eyebrow{font-family:var(--f-mono); font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.ruler{height:14px; margin:10px 0 18px; color:var(--line);
  background:repeating-linear-gradient(90deg, currentColor 0 1.5px, transparent 1.5px 50px) bottom/100% 14px no-repeat,
             repeating-linear-gradient(90deg, currentColor 0 1px, transparent 1px 10px) bottom/100% 7px no-repeat;
  border-bottom:1.5px solid currentColor}
.muted{color:var(--muted)} .small{font-size:.88rem}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px}
button,.btn{font:inherit; font-weight:700; border-radius:12px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink);
  padding:10px 16px; cursor:pointer; min-height:44px; display:inline-flex; align-items:center; justify-content:center; gap:8px; text-decoration:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
button.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
button.ghost{border-color:transparent; background:transparent; color:var(--accent); padding-inline:8px}
button.danger{color:var(--bad); border-color:var(--bad-soft)}
button.mini{min-height:34px; padding:4px 10px; font-size:.85rem; border-radius:9px}
button:disabled{opacity:.5; cursor:not-allowed}
input[type=text],input[type=date],textarea,select{font:inherit; width:100%; padding:10px 12px; border-radius:10px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink)}
textarea{min-height:170px; line-height:1.55; resize:vertical}
textarea.short{min-height:90px}
label.f{display:block; font-weight:700; margin:14px 0 6px}
label.f .muted{font-weight:400}
.hint{font-size:.85rem; color:var(--muted); margin:4px 0 0}
.note{background:var(--accent-soft); border-radius:12px; padding:12px 14px; font-size:.95rem}
.note p{margin:.3em 0}
.note ul{margin:.3em 0; padding-left:1.2em}
.toolbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.saved{font-family:var(--f-mono); font-size:.75rem; color:var(--muted)}

/* layout com menu lateral */
.layout{display:grid; grid-template-columns:290px minmax(0,1fr); gap:18px; align-items:start}
nav.secs{position:sticky; top:12px; max-height:calc(100vh - 24px); overflow:auto; padding:10px}
nav.secs .grp{font-family:var(--f-mono); font-size:.68rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:12px 8px 4px}
nav.secs button{width:100%; justify-content:space-between; min-height:36px; padding:6px 10px; border:none; border-radius:9px; font-weight:500; font-size:.9rem; text-align:left; background:transparent}
nav.secs button.cur{background:var(--accent-soft); color:var(--accent); font-weight:700}
.st{font-family:var(--f-mono); font-size:.72rem; font-weight:700; padding:2px 7px; border-radius:99px; white-space:nowrap; flex:none}
.st.ok{background:var(--ok-soft); color:var(--ok)}
.st.bad{background:var(--bad-soft); color:var(--bad)}
.st.mid{background:var(--near-soft); color:var(--near)}
.st.nada{background:var(--gone-soft); color:var(--gone)}
.mobnav{display:none}
@media (max-width:860px){ .layout{grid-template-columns:minmax(0,1fr)} nav.secs{display:none} .mobnav{display:block; margin-bottom:12px} }

.cols{display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:16px; align-items:start}
@media (max-width:1100px){ .cols{grid-template-columns:minmax(0,1fr)} }
.sug{position:sticky; top:12px}
.sug h3{margin-bottom:8px}
.sug ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.sug li{border-radius:10px; padding:9px 11px; font-size:.9rem; display:grid; grid-template-columns:22px 1fr; gap:4px}
.sug li b.ic{font-size:1rem; line-height:1.3}
.sug li.erro{background:var(--bad-soft); color:var(--bad)}
.sug li.aviso{background:var(--near-soft); color:var(--near)}
.sug li.ok{background:var(--ok-soft); color:var(--ok)}
.sug li .tr{grid-column:2; font-family:var(--f-mono); font-size:.78rem; opacity:.9; overflow-wrap:anywhere}
.tudook{background:var(--ok-soft); color:var(--ok); border-radius:12px; padding:14px; font-weight:700; text-align:center; font-size:1.05rem}

/* tabelas editáveis */
.tablewrap{overflow-x:auto; border:1px solid var(--line); border-radius:12px; background:var(--surface)}
table.ed{border-collapse:collapse; width:100%; font-size:.9rem; min-width:560px}
table.ed th{font-family:var(--f-display); font-size:.75rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; text-align:left; padding:8px; border-bottom:1px solid var(--line)}
table.ed td{padding:4px; border-bottom:1px solid var(--line); vertical-align:top}
table.ed td input,table.ed td select{padding:7px 8px; border-radius:8px; font-size:.9rem}
table.ed td.x{width:36px}
table.ed tr.tot td{font-weight:700; font-family:var(--f-mono); padding:10px 8px}
.bloco{border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; margin:12px 0; background:var(--bg)}
.bloco .cab{display:flex; justify-content:space-between; align-items:center; gap:8px}
.foto{display:grid; grid-template-columns:120px 1fr; gap:12px; align-items:start; margin-top:10px}
.foto .th{width:120px; height:90px; border-radius:8px; border:1.5px dashed var(--line); display:grid; place-items:center; overflow:hidden; color:var(--muted); font-size:.75rem; text-align:center; background:var(--surface)}
.foto .th img{width:100%; height:100%; object-fit:cover}
@media (max-width:520px){ .foto{grid-template-columns:1fr} .row[style*=nowrap]{flex-wrap:wrap!important} }
.navbtns{display:flex; justify-content:space-between; gap:10px; margin-top:18px}
.cnt{font-family:var(--f-mono); font-size:.75rem; color:var(--muted); text-align:right; margin-top:4px}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom,0px)); background:var(--ink); color:var(--bg);
  padding:10px 16px; border-radius:99px; font-weight:700; font-size:.9rem; z-index:20; max-width:90vw; text-align:center}
.resumo-grid{display:grid; gap:8px}
.resumo-grid button{justify-content:space-between; font-weight:500; text-align:left}
dialog{border:none; border-radius:16px; padding:20px; max-width:520px; background:var(--surface); color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.4)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">TCC – CEEP FRG · Técnico em Planejamento e Controle da Produção</div>
      <h1>Assistente do TCC</h1>
    </div>
    <div class="toolbar">
      <span class="saved" id="salvo">Salvo neste navegador</span>
      <button class="mini" id="bSalvar" title="Baixar uma cópia para continuar em outro computador">Salvar cópia</button>
      <button class="mini" id="bAbrir" title="Abrir uma cópia salva antes">Abrir cópia</button>
      <button class="mini danger" id="bNovo">Novo trabalho</button>
      <input type="file" id="fAbrir" accept=".json,application/json" hidden>
    </div>
  </header>
  <div class="ruler"></div>
  <div class="mobnav"><select id="selSec" aria-label="Escolher parte do TCC"></select></div>
  <div class="layout">
    <nav class="secs panel" id="nav" aria-label="Partes do TCC"></nav>
    <main id="main"></main>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<dialog id="dlg"><div id="dlgBody"></div><div class="row" style="justify-content:flex-end;margin-top:16px" id="dlgBtns"></div></dialog>

<script src="config.js"></script>
<script src="../vendor/docx.iife.js" defer></script>
<script src="gerar-docx.js" defer></script>
<script src="importar.js" defer></script>
<script>
'use strict';
/* =====================================================================
   ESTADO, SALVAMENTO E IMAGENS
   ===================================================================== */
const CHAVE = 'tcc-pcp-v1';
const ANO = '2026';
const APP = 'tcc-pcp-ceep';
// trechos do exemplo do modelo (Confeitaria Doce Sabor): se aparecerem, o texto foi copiado do modelo
const RX_MODELO = /doce sabor|m[áa]rcia ribeiro|confeiteira-chefe|chocolate em barra|leite condensado|creme de leite|distribuidora x/i;
const semAcento = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const linhas0 = (n, c) => Array.from({ length: n }, () => Array(c).fill(''));
const figVazia = () => ({ img: '', legenda: '', fonte: '' });
const ferrVazia = () => ({ titulo: '', dados: '', formula: '', variaveis: '', substituicao: '', significado: '', fig: figVazia() });
function estadoInicial() {
  return {
    organizacao: '', titulo: '', subtitulo: '', curso: 'Curso Técnico em Planejamento e Controle da Produção', orientador: 'Prof. Rodrigo Leandro Martins', ano: ANO,
    ficticia: false, integrantes: ['', '', '', ''],
    dedicatoria: '', agradecimentos: '', resumo: '', palavras: '',
    tema: '', contexto: '', problema: '', justificativa: '', objGeral: '', objEsp: ['', '', '', ''],
    historico: '', produtos: linhas0(3, 4), produtosTexto: '', estrutura: linhas0(3, 3), capacidade: '', processo: '',
    fund: [{ titulo: '', texto: '' }, { titulo: '', texto: '' }, { titulo: '', texto: '' }],
    tipoPesquisa: 'Quanto à natureza, trata-se de uma pesquisa aplicada, pois buscou solucionar um problema prático de uma organização. Quanto aos objetivos, classifica-se como descritiva, uma vez que descreve o processo estudado e seus resultados. Quanto aos procedimentos, caracteriza-se como estudo de caso (GIL, 2017). A abordagem é quantitativa, pois se baseia em indicadores numéricos.',
    objeto: '', coleta: '', analise: '',
    etapas: [['Levantamento bibliográfico', 'Livros e artigos', ''], ['Caracterização da organização', '', ''], ['Mapeamento do processo atual', '', ''],
      ['Análise das causas', '', ''], ['Elaboração da proposta', '', ''], ['Aplicação das ferramentas', '', ''], ['Avaliação dos resultados', 'Indicadores', '']],
    procAtual: '', figFluxo: figVazia(), procAnalise: '',
    dadosTexto: '', dados: linhas0(4, 2), dadosUnid: '', dadosAnalise: '', indAtuais: linhas0(3, 3),
    causasTexto: '', figIshikawa: figVazia(), porques: linhas0(5, 2), causasAnalise: '',
    gut: linhas0(4, 4), sintese: '',
    acoes: linhas0(4, 3), planoTexto: '', figPlano: figVazia(), investimento: '', indicadores: linhas0(3, 4),
    ferramentas: [ferrVazia(), ferrVazia()],
    resultados: linhas0(3, 5), resultadosTexto: '', figResultado: figVazia(),
    economiaTexto: '', economiaMensal: '', financeiroTexto: '',
    discussao: [], discussaoTexto: '', conclusao: '',
    referencias: [{ tipo: 'livro' }],
    roteiro: '', naoUsouIA: false, ia: linhas0(1, 5), tarefas: [],
    siglas: [['ABNT', 'Associação Brasileira de Normas Técnicas'], ['GUT', 'Gravidade, Urgência e Tendência'], ['PCP', 'Planejamento e Controle da Produção']],
    sobras: [], galeria: [], importadoDe: '',
  };
}
let S;
try { S = Object.assign(estadoInicial(), JSON.parse(localStorage.getItem(CHAVE) || 'null') || {}); } catch (e) { S = estadoInicial(); }
let salvarT = null;
function salvar() {
  clearTimeout(salvarT);
  document.getElementById('salvo').textContent = 'Salvando…';
  salvarT = setTimeout(() => {
    try { localStorage.setItem(CHAVE, JSON.stringify(S)); document.getElementById('salvo').textContent = 'Salvo neste navegador ✓'; }
    catch (e) { document.getElementById('salvo').textContent = 'Não foi possível salvar: use "Salvar cópia"'; }
  }, 300);
}

// imagens no IndexedDB (fotos são grandes demais para o localStorage)
const IDB = (() => {
  let dbp = null;
  const abrir = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('tcc-pcp-img', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('img');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const op = (modo, f) => abrir().then(db => new Promise((res, rej) => {
    const t = db.transaction('img', modo); const s = t.objectStore('img'); const r = f(s);
    t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error);
  }));
  return {
    put: (id, v) => op('readwrite', s => s.put(v, id)),
    get: id => op('readonly', s => s.get(id)),
    del: id => op('readwrite', s => s.delete(id)),
    keys: () => op('readonly', s => s.getAllKeys()),
    clear: () => op('readwrite', s => s.clear()),
  };
})();
const urlCache = {};
async function urlImg(id) {
  if (!id) return '';
  if (urlCache[id]) return urlCache[id];
  const v = await IDB.get(id).catch(() => null);
  if (!v) return '';
  return (urlCache[id] = URL.createObjectURL(new Blob([v.data], { type: v.type === 'png' ? 'image/png' : 'image/jpeg' })));
}
function reduzirImagem(file) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file); const im = new Image();
    im.onload = () => {
      const k = Math.min(1, 1600 / Math.max(im.naturalWidth, im.naturalHeight));
      const w = Math.round(im.naturalWidth * k), h = Math.round(im.naturalHeight * k);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(im, 0, 0, w, h);
      URL.revokeObjectURL(u);
      c.toBlob(b => b ? b.arrayBuffer().then(buf => res({ data: buf, w, h, type: 'jpg' })) : rej(new Error('img')), 'image/jpeg', 0.85);
    };
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('Não consegui abrir essa imagem. Use JPG ou PNG.')); };
    im.src = u;
  });
}
const novoId = () => 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* =====================================================================
   VERIFICAÇÕES (sem IA: regras)
   ===================================================================== */
const L = s => String(s == null ? '' : s).trim();
const tem = s => L(s) !== '';
const palavras = s => (L(s).match(/[A-Za-zÀ-ÿ0-9][A-Za-zÀ-ÿ0-9'’-]*/g) || []).length;
const temNumero = s => /\d/.test(s || '');
const E = (m, t) => ({ n: 'erro', m, t }), A = (m, t) => ({ n: 'aviso', m, t }), OK = m => ({ n: 'ok', m });
const RX = {
  marca: /\[[^\]]*\]|EDIT[ÁA]VEL|\bINSERIR\b|\bPREENCHER\b|como (você|vc) pediu|na vers[ãa]o final|voc[êe] est[áa] criando|ORIENTA[ÇC][ÃA]O|apague esta caixa|lorem ipsum|aqui est[áa] (o|a|um|uma)|espero que (isso|isto) ajude/i,
  emoji: /[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B50}]/u,
  alheio: /\bbacharel|\bgradua[çc][ãa]o\b|engenharia de produ[çc][ãa]o|universidade|monografia|disserta[çc][ãa]o/i,
  futuro: /(?<![A-Za-zÀ-ÿ])(será|serão|seremos|iremos|vamos|irá|irão|deverá|deverão|poderá|poderão|pretendemos|pretende-se|faremos)(?![A-Za-zÀ-ÿ])/i,
  futuro2: /(?<![A-Za-zÀ-ÿ])[a-zà-ÿ]{3,}(?:ar|er|ir)(?:á|ão|emos)(?![A-Za-zÀ-ÿ])/i,
  forte: /comprovam?|comprovad[oa]s?|perfeit[ao]s?|perfeitamente|\bgarant(e|em|imos|ir)\b|revolucion|inovador|exponencial|indispens[áa]vel|totalmente|rigorosamente|absolutamente|o melhor do mercado|m[áa]xima efici/i,
  eu: /(?<![A-Za-zÀ-ÿ])(eu|meu|minha|meus|minhas|comigo)(?![A-Za-zÀ-ÿ])/i,
  informal: /(?<![A-Za-zÀ-ÿ])(vc|vcs|pq|tb|tbm|né|tipo assim|a gente|pra|pro|coisa|coisas|muito top|show de bola)(?![A-Za-zÀ-ÿ])/i,
  decimal: /\b\d+\.\d+\s?(%|h|min|s|kg|g|m|km|un|unidades|pe[çc]as|R\$)/,
  dinheiro: /R\$\s?\d+\.\d{2}\b(?!\d)/,
  citacao: /\([A-ZÀ-Ý][A-ZÀ-Ý\s.&;-]+,\s*\d{4}[a-z]?(?:,\s*p\.\s*\d+)?\)|[A-ZÀ-Ý][a-zà-ÿ]+(?:\s+et al\.|\s+e\s+[A-ZÀ-Ý][a-zà-ÿ]+)?\s*\(\d{4}/,
  loja: /amazon\.|mercadolivre\.|shopee\.|magazineluiza\.|americanas\./i,
};
const trecho = (s, rx) => { const m = String(s).match(rx); return m ? '“' + m[0] + '”' : ''; };
function analisa(texto, o = {}) {
  const r = [];
  const s = L(texto);
  if (!s) return r;
  if (RX_MODELO.test(s)) r.push(E('Esse trecho é do exemplo do modelo (Confeitaria Doce Sabor). Escrevam com os dados da organização de vocês.', trecho(s, RX_MODELO)));
  if (RX.marca.test(s)) r.push(E('Sobrou marca de modelo ou de IA. Apaguem e escrevam com os dados do grupo.', trecho(s, RX.marca)));
  if (RX.emoji.test(s)) r.push(E('Tem emoji no texto. Trabalho acadêmico não usa emoji.', trecho(s, RX.emoji)));
  if (RX.alheio.test(s)) r.push(A('Esse trecho parece ter vindo de outro tipo de trabalho (faculdade). Confiram se é texto do grupo.', trecho(s, RX.alheio)));
  if (o.passado) {
    if (RX.futuro.test(s)) r.push(E('Verbo no futuro. Esta parte conta o que já foi feito: escrevam no passado (“foi feito”, “foram levantados”).', trecho(s, RX.futuro)));
    else if (RX.futuro2.test(s)) r.push(A('Parece ter verbo no futuro. Confiram se o texto está no passado.', trecho(s, RX.futuro2)));
  }
  if (RX.forte.test(s) && !o.semForte) r.push(A('Afirmação muito forte. Só mantenham se tiverem o número para provar.', trecho(s, RX.forte)));
  if (RX.eu.test(s)) r.push(A('O TCC é da equipe: evitem “eu”, “meu”, “minha”.', trecho(s, RX.eu)));
  if (RX.informal.test(s)) r.push(A('Linguagem informal. Troquem por uma forma mais formal.', trecho(s, RX.informal)));
  if (RX.decimal.test(s) || RX.dinheiro.test(s)) r.push(A('Em português, o decimal usa vírgula: 1,5 h; R$ 470,00 (e não 1.5 h).', trecho(s, RX.decimal) || trecho(s, RX.dinheiro)));
  const frases = s.split(/(?<=[.!?])\s+/).filter(f => palavras(f) > 45);
  if (frases.length) r.push(A(`Há ${frases.length === 1 ? 'uma frase muito longa' : frases.length + ' frases muito longas'} (mais de 45 palavras). Dividam em frases menores.`, '“' + frases[0].slice(0, 70) + '…”'));
  if (o.citacao === 'exige' && !RX.citacao.test(s)) r.push(E('Falta citação. Indiquem de onde veio a informação: (SOBRENOME, ano) ou Sobrenome (ano).'));
  if (o.citacao === 'sugere' && !RX.citacao.test(s)) r.push(A('Que tal citar um autor? Ex.: (TUBINO, 2017) ou Segundo Slack (2018).'));
  if (o.semCitacao && RX.citacao.test(s)) r.push(A('Esta parte não leva citação.', trecho(s, RX.citacao)));
  if (o.numero && !temNumero(s)) r.push(A('Coloquem números: quantidades, tempos, percentuais, valores. O PCP trabalha com dados.'));
  if (o.min && palavras(s) < o.min) r.push(A(`Texto curto (${palavras(s)} palavras). O ideal é pelo menos ${o.min}.`));
  return r;
}
const vazioTab = t => !(t || []).some(r => r && r.some(c => tem(c)));
const linhasCheias = t => (t || []).filter(r => r && r.some(c => tem(c)));
const numBR = v => { const x = parseFloat(String(v || '').replace(/[^\d,.\-]/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.')); return isNaN(x) ? 0 : x; };
const temNum = v => /\d/.test(String(v || ''));
const real = v => v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmt = (v, d = 1) => v.toLocaleString('pt-BR', { maximumFractionDigits: d });
// cálculos automáticos
const gutNota = l => (temNum(l[1]) && temNum(l[2]) && temNum(l[3])) ? numBR(l[1]) * numBR(l[2]) * numBR(l[3]) : null;
const custoTotal = () => numBR(S.investimento);
function variacao(antes, depois) {
  if (!temNum(antes) || !temNum(depois)) return '–';
  const a = numBR(antes), d = numBR(depois);
  if (/%/.test(antes + depois)) { const pp = d - a; return (pp > 0 ? '+' : pp < 0 ? '−' : '') + fmt(Math.abs(pp)) + ' p.p.'; }
  if (!a) return '–';
  const v = (d - a) / a * 100; return (v > 0 ? '+' : v < 0 ? '−' : '') + fmt(Math.abs(v), 0) + '%';
}
function payback() {
  const inv = custoTotal(), eco = numBR(S.economiaMensal);
  if (!inv || !eco) return null;
  return inv / eco;
}

sec({ id: 'ferramentas', grp: '7 Aplicação', nome: '7 Aplicação das ferramentas',

/* =====================================================================
   STATUS
   ===================================================================== */
function status(s) {
  if (s.entrega) return null;
  if (s.vazio && s.vazio()) return { c: s.opc ? 'nada' : 'nada', txt: s.opc ? 'opcional' : 'vazio', erros: 0, avisos: 0, itens: [] };
  const itens = s.check ? s.check() : [];
  const erros = itens.filter(i => i.n === 'erro').length, avisos = itens.filter(i => i.n === 'aviso').length;
  if (erros) return { c: 'bad', txt: `✗ ${erros}`, erros, avisos, itens };
  if (avisos) return { c: 'mid', txt: `! ${avisos}`, erros, avisos, itens };
  return { c: 'ok', txt: '✓', erros, avisos, itens };
}

const urlEnvio = () => L(window.TCC_CONFIG && window.TCC_CONFIG.urlEnvio);

const blobB64 = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });

    if (corpo.length > 45 * 1024 * 1024) throw new Error('O trabalho ficou grande demais para enviar. Tirem algumas fotos repetidas.');

  } catch (err) {

    await dialogo(`<p><b>Não foi possível enviar.</b></p><p class="small">${esc(err.message || 'Verifiquem a internet e tentem de novo.')}</p><p class="small">Enquanto isso, baixem o Word e entreguem no Classroom.</p>`, [['Ok', true, 'primary']]);
  } finally { const bb = $('#bEnviar'); if (bb) { bb.disabled = false; bb.textContent = '📤 Enviar para o professor'; } }
}
function baixar(blob, nome) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }

/* ---------- cópia de segurança ---------- */
const ab2b64 = buf => { let s = ''; const u = new Uint8Array(buf); for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
const b642ab = b => { const s = atob(b); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u.buffer; };
async function dadosCopia() {
  const imagens = {};
  for (const id of await IDB.keys().catch(() => [])) { if (!idEmUso(id)) continue; const v = await IDB.get(id); imagens[id] = { w: v.w, h: v.h, type: v.type, b64: ab2b64(v.data) }; }
  return { app: APP, versao: 1, salvoEm: new Date().toISOString(), trabalho: S, imagens };
}
async function salvarCopia() {
  const dados = await dadosCopia();
  const nome = 'copia_TCC_' + (S.integrantes.find(tem) || 'grupo').split(' ')[0] + '_' + new Date().toISOString().slice(0, 10) + '.json';
  baixar(new Blob([JSON.stringify(dados)], { type: 'application/json' }), nome);
  toast('Cópia salva ✓ Guardem no Drive.');
}
window.salvarCopia = salvarCopia;
$('#bSalvar').onclick = salvarCopia;
$('#bAbrir').onclick = () => $('#fAbrir').click();
$('#fAbrir').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (d.app !== APP || !d.trabalho) throw new Error(d.app === 'tcc-mecanica-ceep' ? 'Essa cópia é do Assistente do TCC de Mecânica. Abram no assistente certo.' : 'Esse arquivo não é uma cópia do Assistente do TCC do PCP.');
    const ok = await dialogo('<p><b>Abrir esta cópia?</b></p><p>O trabalho que está agora neste navegador será substituído.</p>', [['Cancelar', false], ['Abrir', true, 'primary']]);
    if (!ok) return;
    await IDB.clear();
    for (const [id, v] of Object.entries(d.imagens || {})) await IDB.put(id, { w: v.w, h: v.h, type: v.type, data: b642ab(v.b64) });
    S = Object.assign(estadoInicial(), d.trabalho);
    Object.keys(urlCache).forEach(k => delete urlCache[k]);
    salvar(); desenhar(); toast('Cópia aberta ✓');
  } catch (err) { toast(err.message || 'Não consegui abrir esse arquivo.'); }
};
$('#bNovo').onclick = async () => {
  const ok = await dialogo('<p><b>Começar um trabalho novo?</b></p><p>Tudo o que está neste navegador será apagado, inclusive as fotos. Se ainda não salvaram, cliquem em <b>Salvar cópia</b> antes.</p>',
    [['Cancelar', false], ['Salvar cópia antes', 'copia'], ['Apagar e começar', true, 'danger']]);
  if (ok === 'copia') return salvarCopia();
  if (!ok) return;
  await IDB.clear().catch(() => {});
  S = estadoInicial(); atual = SEC[0].id; salvar(); desenhar();
};

/* ---------- importar o que a equipe já fez ---------- */
// chave do dado importado -> seção onde ele aparece
const SEC_DO_CAMPO = { resumo: 'resumo', palavras: 'resumo', dedicatoria: 'pre', agradecimentos: 'pre', tema: 'tema', contexto: 'tema', problema: 'problema',
  justificativa: 'justificativa', objGeral: 'objetivos', objEsp: 'objetivos', historico: 'historico', produtos: 'historico', produtosTexto: 'historico',
  estrutura: 'estrutura', capacidade: 'estrutura', processo: 'estrutura', fund: 'fund', tipoPesquisa: 'metodo', objeto: 'metodo', coleta: 'metodo',
  analise: 'metodo', etapas: 'metodo', procAtual: 'procAtual', procAnalise: 'procAtual', dadosTexto: 'dados', dados: 'dados', dadosAnalise: 'dados',
  indAtuais: 'dados', causasTexto: 'causas', porques: 'causas', causasAnalise: 'causas', gut: 'gut', sintese: 'gut', acoes: 'proposta', planoTexto: 'proposta', investimento: 'proposta',
  indicadores: 'indicadores', ferramentas: 'ferramentas', resultados: 'resultados', resultadosTexto: 'resultados',
  economiaTexto: 'financeiro', economiaMensal: 'financeiro', tarefas: 'apendices', discussao: 'discussao', discussaoTexto: 'discussao', conclusao: 'conclusao', referencias: 'referencias', roteiro: 'apendices', ia: 'apendices',
  titulo: 'grupo', integrantes: 'grupo', organizacao: 'grupo' };
function campoVazio(k) {
  const v = S[k];
  if (v == null) return true;
  if (k === 'tipoPesquisa') return !tem(v) || v === estadoInicial().tipoPesquisa;
  if (typeof v === 'string') return !tem(v);
  if (k === 'objEsp' || k === 'integrantes') return !v.some(tem);
  if (k === 'fund') return !v.some(f => tem(f.titulo) || tem(f.texto));
  if (k === 'ferramentas') return !v.some(f => [f.titulo, f.dados, f.formula, f.substituicao, f.significado].some(tem) || (f.fig && f.fig.img));
  if (k === 'referencias') return !v.some(x => tem(x.titulo) || tem(x.livre));
  if (k === 'etapas') return !v.some(l => tem(l[2]));
  if (k === 'discussao') return !v.some(d => d && (tem(d.resultado) || tem(d.situacao)));
  if (k === 'tarefas') return !v.some(tem);
  if (Array.isArray(v) && Array.isArray(v[0])) return vazioTab(v);
  return false;
}
function trabalhoVazio() { return SEC.filter(s => s.vazio && !['grupo', 'metodo', 'apendices'].includes(s.id)).every(s => s.vazio()); }
async function importarArquivo(file) {
  if (!window.TCCImport) { toast('Aguarde: a ferramenta ainda está carregando.'); return; }
  let res;
  try {
    toast('Lendo o arquivo…');
    const blocos = await TCCImport.ler(file, new URL('../vendor/', location.href).href);
    res = TCCImport.mapear(blocos);
  } catch (err) { console.error(err); toast(err.message || 'Não consegui ler esse arquivo.'); return; }
  const chaves = Object.keys(res.dados);
  if (!chaves.length && !res.imagens.length) {
    await dialogo('<p><b>Não encontrei as partes do TCC nesse arquivo.</b></p><p>O assistente reconhece as partes pelos títulos do modelo (Introdução, Caracterização da organização, Diagnóstico do processo, Proposta de melhoria...). Confiram se o arquivo tem esses títulos ou copiem e colem o texto em cada parte.</p>', [['Entendi', true, 'primary']]);
    return;
  }
  if (res.modelo) {
    const seg = await dialogo('<p><b>Esse arquivo ainda tem o texto de exemplo do modelo</b> (Confeitaria Doce Sabor).</p><p>O assistente vai trazer só o que não for do exemplo, mas confiram com cuidado: o que sobrar do exemplo aparece marcado com ✗.</p>', [['Cancelar', false], ['Continuar', true, 'primary']]);
    if (!seg) return;
  }
  let modo = 'vazios';
  if (!trabalhoVazio()) {
    modo = await dialogo(`<p><b>Já existe conteúdo neste trabalho.</b></p><p>O que fazer com as partes que já estão preenchidas?</p>`,
      [['Cancelar', null], ['Substituir pelo arquivo', 'substituir', 'danger'], ['Completar só o que está em branco', 'vazios', 'primary']]);
    if (!modo) return;
  }
  $('#toast').hidden = true;
  const D = res.dados; const aplicados = new Set();
  const larg = { produtos: 4, estrutura: 3, etapas: 3, dados: 2, indAtuais: 3, porques: 2, gut: 4, acoes: 3, indicadores: 4, resultados: 5, ia: 5, siglas: 2 };
  if (D.tarefasTab) { const ns = (D.integrantes || S.integrantes); D.tarefas = ns.map(nm => { const l = D.tarefasTab.find(x => tem(nm) && semAcento(x[0]) === semAcento(nm)); return l ? l[1] : ''; }); delete D.tarefasTab; if (!D.tarefas.some(tem)) delete D.tarefas; }
  const chaves2 = Object.keys(D); chaves.length = 0; chaves.push(...chaves2);
  for (const k of chaves) {
    if (modo === 'substituir' || campoVazio(k)) {
      let v = D[k];
      if (k === 'objEsp') v = v.filter(tem).slice(0, 5);
      if (k === 'integrantes') { v = v.slice(0, 4); while (v.length < 4) v.push(''); }
      if (larg[k]) v = v.map(l => Array.from({ length: larg[k] }, (_, i) => L(l[i])));
      if (k === 'ferramentas') v = v.map(f => Object.assign(ferrVazia(), f));
      if (k === 'discussao') { const es = (D.objEsp || S.objEsp).filter(tem); v = es.map((o, i) => { const l = v.find(x => semAcento(x[0]).slice(0, 25) === semAcento(o).slice(0, 25)) || v[i] || []; return { resultado: L(l[1]), situacao: ['Atingido', 'Atingido em parte', 'Não atingido'].find(x => semAcento(x) === semAcento(l[2])) || '' }; }); }
      S[k] = v; aplicados.add(k);
    }
  }
  // imagens
  let fotos = 0, fotosSobra = 0;
  for (const im of res.imagens) {
    const a = im.alvo || { tipo: 'sobra' };
    try {
      const tipo = im.ext === 'png' ? 'image/png' : im.ext === 'gif' ? 'image/gif' : 'image/jpeg';
      const red = await reduzirImagem(new Blob([im.bytes], { type: tipo }));
      const id = novoId(); await IDB.put(id, red);
      const fig = { img: id, legenda: im.legenda || '', fonte: im.fonte || '' };
      let ok = false;
      if (a.tipo === 'campo' && S[a.k] && (!S[a.k].img || modo === 'substituir')) { S[a.k] = fig; ok = true; }
      else if (a.tipo === 'ferramenta' && aplicados.has('ferramentas')) { const f = S.ferramentas[a.i]; if (f && !f.fig.img) { f.fig = fig; ok = true; } }
      if (ok) fotos++; else { S.galeria.push(fig); fotosSobra++; }
    } catch (e) { fotosSobra++; }
  }
  // garante a forma esperada pelas telas
  if (!S.fund.length) S.fund.push({ titulo: '', texto: '' });
  if (!S.ferramentas.length) S.ferramentas.push(ferrVazia());
  S.ferramentas.forEach(f => { if (!f.fig) f.fig = figVazia(); });
  while (S.objEsp.length < 3) S.objEsp.push('');
  if (!S.referencias.length) S.referencias.push({ tipo: 'livro' });
  Object.keys(larg).forEach(k => { if (!Array.isArray(S[k]) || !S[k].length) S[k] = linhas0(1, larg[k]); });
  S.sobras = (modo === 'substituir' ? [] : (S.sobras || [])).concat(res.sobras);
  if (!Array.isArray(S.galeria)) S.galeria = [];
  S.importadoDe = `${file.name} (${new Date().toLocaleDateString('pt-BR')})`;
  salvar(); desenhar();
  // relatório
  const secs = [...new Set([...aplicados].map(k => SEC_DO_CAMPO[k]).filter(Boolean))];
  const nomes = SEC.filter(s => secs.includes(s.id)).map(s => `<li>${esc(s.nome)}</li>`).join('');
  const naoAplic = chaves.filter(k => !aplicados.has(k)).length;
  await dialogo(`<p><b>Pronto! O arquivo foi lido.</b></p>
    <p>Partes preenchidas com o que vocês já tinham:</p><ul style="margin:.3em 0;padding-left:1.2em;max-height:30vh;overflow:auto">${nomes || '<li>nenhuma</li>'}</ul>
    ${fotos ? `<p>${fotos} imagem(ns) colocada(s) nas partes certas.</p>` : ''}
    ${naoAplic ? `<p class="small">${naoAplic} parte(s) do arquivo não foram usadas porque já estavam preenchidas aqui.</p>` : ''}
    ${res.sobras.length || fotosSobra ? `<p class="small">${res.sobras.length ? res.sobras.length + ' trecho(s)' : ''}${res.sobras.length && fotosSobra ? ' e ' : ''}${fotosSobra ? fotosSobra + ' imagem(ns)' : ''} não tinham lugar certo. ${res.sobras.length ? 'Os trechos estão listados em “Dados da equipe”.' : ''}${fotosSobra ? ' As imagens podem ser escolhidas em qualquer figura, no botão “Usar imagem do arquivo enviado”.' : ''}</p>` : ''}
    <p><b>Agora:</b> confiram cada parte. As que estão com <span style="color:var(--bad)">✗</span> precisam de correção.</p>`, [['Ver a situação de cada parte', true, 'primary']]);
  ir('entrega');
}

// garante tamanhos mínimos (cópias antigas)
while (S.integrantes.length < 4) S.integrantes.push('');
while (S.integrantes.length > 4 && !tem(S.integrantes[S.integrantes.length - 1])) S.integrantes.pop();
if (!S.figPlano) S.figPlano = figVazia();
['tarefas', 'discussao', 'galeria', 'sobras'].forEach(k => { if (!Array.isArray(S[k])) S[k] = []; });
if (!Array.isArray(S.ferramentas) || !S.ferramentas.length) S.ferramentas = [ferrVazia()];
S.ferramentas.forEach(f => { if (!f.fig) f.fig = figVazia(); });
desenhar();
window.addEventListener('load', () => { if (atual === 'referencias') desenhar(); });
</script>
