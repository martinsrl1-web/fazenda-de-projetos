<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Paquímetro Polegada Fracionária</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Big+Shoulders+Display:wght@700;800&display=swap">
<style>
:root{--bg:#E4EAEF;--panel:#F5F8FA;--ink:#14202B;--muted:#4F5F6C;--line:#B8C4CE;--accent:#A85400;--accent-ink:#fff;--ok:#17703F;--bad:#B3261E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1926;--panel:#132638;--ink:#E8EEF3;--muted:#98AAB9;--line:#2A4258;--accent:#F2A93B;--accent-ink:#1a1204;--ok:#5FD08F;--bad:#FF8A80}}
:root[data-theme="dark"]{--bg:#0D1926;--panel:#132638;--ink:#E8EEF3;--muted:#98AAB9;--line:#2A4258;--accent:#F2A93B;--accent-ink:#1a1204;--ok:#5FD08F;--bad:#FF8A80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 Barlow,'Arial Narrow',Arial,sans-serif}
main{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
h1{font:800 clamp(36px,8vw,60px)/.95 'Big Shoulders Display','Arial Narrow',Impact,sans-serif;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 14px;max-width:66ch}
.stage{background:#1D3B5C;border-radius:6px;padding:10px 4px 4px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.stage svg{display:block;width:100%;height:auto;margin:0 auto}
#zoom{cursor:grab;max-height:50dvh}#zoom.fixed{cursor:default}#zoom.drag{cursor:grabbing}
.ctl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:8px 0 4px}
.ctl button{font:700 18px/1 'Big Shoulders Display','Arial Narrow',sans-serif;min-width:62px;min-height:44px;padding:0 8px;border-radius:4px;border:1px solid #4E6E8E;background:#24486E;color:#E8EEF3;cursor:pointer;font-variant-numeric:tabular-nums}
.ctl button:disabled{opacity:.35;cursor:default}
.ctl i{width:12px}
.rot{display:none;color:#BFD3E6;font-size:14px;text-align:center;margin:2px 0 0}
.tabs{display:flex;margin:14px 0 12px;border:2px solid var(--ink);border-radius:4px;overflow:hidden;width:fit-content;max-width:100%}
.tabs button{font:700 20px/1 'Big Shoulders Display','Arial Narrow',sans-serif;letter-spacing:.03em;padding:11px 18px;min-height:48px;background:transparent;color:var(--ink);border:0;cursor:pointer}
.tabs button+button{border-left:2px solid var(--ink)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px}
.big{font:800 clamp(48px,12vw,88px)/.95 'Big Shoulders Display','Arial Narrow',sans-serif;font-variant-numeric:tabular-nums}
.big small{font-size:.38em;margin-left:.2em;color:var(--muted)}
.stats{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:12px;color:var(--muted)}
.stats b{display:block;font:800 28px/1 'Big Shoulders Display',sans-serif;color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
button.act{font:700 19px/1 'Big Shoulders Display','Arial Narrow',sans-serif;letter-spacing:.03em;padding:13px 22px;min-height:48px;border-radius:4px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input.n{font:800 40px/1 'Big Shoulders Display',sans-serif;min-height:54px;padding:4px 8px;border:2px solid var(--ink);border-radius:4px;background:var(--bg);color:var(--ink);text-align:right;width:6.5ch}
.fin{display:inline-flex;align-items:center;gap:8px}
.unit{font:800 30px/1 'Big Shoulders Display',sans-serif;color:var(--muted)}
.soma{display:grid;grid-template-columns:auto auto auto;gap:8px 12px;align-items:center;justify-content:start;margin-top:10px}
.soma .op{font:800 34px/1 'Big Shoulders Display',sans-serif;color:var(--muted);text-align:right}
.soma .lb{font-size:15px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.soma hr{grid-column:1/-1;width:100%;border:0;border-top:3px solid var(--ink);margin:2px 0}
.soma output{font:800 44px/1 'Big Shoulders Display',sans-serif;font-variant-numeric:tabular-nums;text-align:right;padding-right:10px}
.contas{display:flex;gap:16px 36px;flex-wrap:wrap;margin-top:10px}
.conta{display:grid;grid-template-columns:auto auto auto;gap:2px 10px;align-items:baseline;padding:10px 16px;border-radius:6px;background:var(--panel);border:1px solid var(--line)}
.conta .tt{grid-column:1/-1;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.conta .op{font:800 30px/1.1 'Big Shoulders Display',sans-serif;color:var(--muted);text-align:right}
.conta .v{font:800 34px/1.1 'Big Shoulders Display',sans-serif;font-variant-numeric:tabular-nums;text-align:right}
.conta .m{font-size:14px;font-weight:700}
.conta .m.ok{color:var(--ok)}.conta .m.no{color:var(--bad)}
.conta .v.no{color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px}
.conta hr{grid-column:1/-1;width:100%;border:0;border-top:3px solid var(--ink);margin:2px 0}
.lbl{font-size:14px;color:var(--muted);display:block;margin-bottom:2px;letter-spacing:.06em;text-transform:uppercase}
.fb{margin-top:12px;padding:12px 14px;border-left:6px solid var(--line);background:var(--bg);border-radius:0 4px 4px 0}
.fb.ok{border-color:var(--ok)}.fb.no{border-color:var(--bad)}
.eq{color:var(--muted);margin:8px 0 0}.eq b{color:var(--ink)}
label.chk{display:flex;gap:8px;align-items:center;cursor:pointer}
details.how{margin-top:12px;border-top:1px solid var(--line);padding-top:8px;color:var(--muted)}
details.how summary{cursor:pointer;font-weight:600;color:var(--ink)}
details.how ol{margin:6px 0 0;padding-left:22px}
.copied{color:var(--ok);font-weight:700;margin-left:8px}
.task{display:inline-block;font:700 14px/1 Barlow,sans-serif;letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:5px 8px;border-radius:3px;margin-bottom:8px}
@media (max-width:640px){.tabs{width:100%}.tabs button{flex:1;padding:11px 4px;font-size:17px}.row .act{flex:1 1 auto}.ctl button{min-width:56px;font-size:16px}.ctl i{display:none}}
@media (orientation:portrait) and (max-width:640px){.rot{display:block}}
@media (orientation:landscape) and (max-height:820px){
 main{padding:10px 18px 18px;max-width:1200px}h1{font-size:34px;margin:0 0 6px}.sub{display:none}
 #zoom{max-height:44dvh}.tabs{margin:8px 0}.tabs button{padding:8px 16px;min-height:42px;font-size:18px}
 .panel{padding:12px 16px}.stats{margin-bottom:6px}.stats b{font-size:24px}.big{font-size:54px}.row{margin-top:8px}.fb{margin-top:8px;padding:8px 12px}
}
@media (prefers-reduced-motion:no-preference){.fb{animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(4px);opacity:.4}}}

/* Cabeçalho comum do site Fazenda de Projetos */
.fp-in{max-width:1000px;margin-inline:auto;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px 20px;flex-wrap:wrap}
.fp-brand{font:800 27px/1 'Big Shoulders Display','Arial Narrow',Impact,sans-serif;letter-spacing:.04em;text-transform:uppercase;text-decoration:none;color:var(--ink)}
.fp-brand b{color:var(--accent);font-weight:800}
.fp-onde{font:600 13.5px/1.2 Barlow,'Arial Narrow',Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fp-rule{height:24px;border-block:1px solid var(--line);
  background-image:linear-gradient(90deg,var(--ink) 0 2px,transparent 2px),linear-gradient(90deg,var(--muted) 0 1px,transparent 1px),linear-gradient(90deg,var(--muted) 0 1px,transparent 1px);
  background-size:80px 100%,40px 62%,8px 36%;background-repeat:repeat-x;background-position:16px 0}
.fin .fstack{display:inline-flex;flex-direction:column;align-items:center;gap:4px}
.fin .fstack i{display:block;width:100%;height:3px;background:var(--ink);border-radius:2px}
input.n.w{width:2.6ch;text-align:center}
input.n.f{width:3.2ch;font-size:30px;min-height:44px;text-align:center}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;font-size:.5em;margin-left:.08em}
.fr span:first-child{border-bottom:.08em solid currentColor;padding:0 .1em .06em}
.fr span:last-child{padding-top:.06em}
.conta .v .fr{font-size:.62em}
.cnt{font:800 30px/1 'Big Shoulders Display',sans-serif;color:var(--muted)}
.tab8{border-collapse:collapse;margin-top:8px;font-size:15px}
.tab8 td,.tab8 th{border:1px solid var(--line);padding:4px 8px;text-align:center}

/* Correção bem visível: verde com ✓ quando acerta, vermelho com ✗ quando erra */
.fb.ok,.fb.no{border-left-width:8px;padding:14px 16px;display:flow-root}
.fb.ok{background:color-mix(in srgb,var(--ok) 13%,var(--bg))}
.fb.no{background:color-mix(in srgb,var(--bad) 12%,var(--bg))}
.fb.ok::before,.fb.no::before{content:'✓';float:left;width:58px;height:58px;border-radius:50%;background:#17703F;color:#fff;font:800 38px/58px Arial,sans-serif;text-align:center;margin:0 14px 6px 0}
.fb.no::before{content:'✗';background:#B3261E}
.fb.ok>strong:first-child,.fb.ok>b:first-child{color:#17703F;font-size:24px}
.fb.no>strong:first-child,.fb.no>b:first-child{color:#B3261E;font-size:24px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fb.ok>strong:first-child,:root:not([data-theme="light"]) .fb.ok>b:first-child{color:var(--ok)}:root:not([data-theme="light"]) .fb.no>strong:first-child,:root:not([data-theme="light"]) .fb.no>b:first-child{color:var(--bad)}}
.conta .m.ok,.conta .m.no{color:#fff;border-radius:12px;padding:3px 9px;font-size:14px;white-space:nowrap}
.conta .m.ok{background:#17703F}.conta .m.no{background:#B3261E}
.par b.okc::before{content:'✓ ';}.par b.noc::before{content:'✗ ';}
</style>
</head>
<body>
<header class="fp-top">
  <div class="fp-in"><a class="fp-brand" href="../index.html">Fazenda <b>de Projetos</b></a><span class="fp-onde">Metrologia · Paquímetro</span></div>
  <div class="fp-rule" aria-hidden="true"></div>
</header>
<main>
<h1>Paquímetro Polegada Fracionária</h1>
<p class="sub">Escala fixa com divisões de 1/16" e nônio de 8 divisões: resolução de 1/128". Arraste a escala, ou use os botões, e encontre o traço do nônio que coincide com a escala fixa.</p>
<div class="stage">
  <svg id="zoom" viewBox="0 0 2000 600" xmlns="http://www.w3.org/2000/svg" role="slider" tabindex="0" aria-label="Escala fixa e nônio: arraste para mover o cursor">
    <defs><clipPath id="cb"><rect x="22" y="22" width="1956" height="306"/></clipPath></defs>
    <rect x="20" y="20" width="1960" height="310" rx="6" fill="#C9CBCD" stroke="#373435" stroke-width="5"/>
    <g id="beam" clip-path="url(#cb)"></g>
    <g id="plate"></g>
    <g id="guide" stroke-linecap="round"></g>
  </svg>
  <div class="ctl" id="ctl">
    <button data-d="-128" aria-label="Fechar 1 polegada">−1"</button>
    <button data-d="-8" aria-label="Fechar 1/16 de polegada">−1/16</button>
    <button data-d="-1" aria-label="Fechar 1/128 de polegada">−1/128</button>
    <i></i>
    <button data-d="1" aria-label="Abrir 1/128 de polegada">+1/128</button>
    <button data-d="8" aria-label="Abrir 1/16 de polegada">+1/16</button>
    <button data-d="128" aria-label="Abrir 1 polegada">+1"</button>
  </div>
  <p class="rot">Gire o celular para ver a escala maior.</p>
</div>
<div class="tabs" role="tablist" aria-label="Modo">
  <button role="tab" data-m="explore">Explorar</button>
  <button role="tab" data-m="basic">Básico</button>
  <button role="tab" data-m="medio">Médio</button>
  <button role="tab" data-m="avancado">Avançado</button>
</div>
<section class="panel" id="panel" aria-live="polite"></section>
</main>
<script>
/* Polegada fracionária: escala fixa de 1/16" (8 unidades de 1/128"), nônio de 8 divisões -> resolução 1/128".
   A posição do cursor (S.p) é sempre um número inteiro de 1/128". */
const FD=8,ND=8,PPU=7.5,MAX=704,ZX=640,MARG=150,LINE=330,W=2000,BX0=22,BX1=1978;
const VD=(FD-1)*PPU,VL=ND*VD;
const $=id=>document.getElementById(id),P=$('panel'),Z=$('zoom');
const S={mode:'explore',p:157,cam:0,target:0,task:'read',round:1,score:0,correct:0,streak:0,best:0,done:false,answered:false,hint:false,guide:true,last:null,played:0,used:null};
const RN=()=>({basic:50,medio:20,avancado:10})[S.mode]||10;
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);

/* ---------- frações (u em 1/128") ---------- */
function parts(u,den=128){const w=Math.floor(u/den);let n=u%den,d=den;if(n){const g=gcd(n,d);n/=g;d/=g}return{w,n,d}}
function fTxt(u){const {w,n,d}=parts(u);return n?`${w?w+' ':''}${n}/${d}"`:`${w}"`}
function rawTxt(u,den){const w=Math.floor(u/den),n=u%den;return n?`${w?w+' ':''}${n}/${den}"`:`${w}"`}
function fHTML(u){const {w,n,d}=parts(u);if(!n)return `${w}"`;return `${w?w:''}<span class="fr"><span>${n}</span><span>${d}</span></span>"`}
const mm=u=>u/128*25.4;
const mmTxt=v=>v.toFixed(2).replace('.',',')+' mm';
function simpChain(n,d){if(!n)return `0`;let s=`${n}/${d}`;while(n%2===0&&d>1){n/=2;d/=2;s+=` = ${n}/${d}`}return s}
function explain(u){const n=Math.floor(u/FD),r=u%FD,w=Math.floor(n/16),k=n%16,fx=n*FD;
  const esc=`${w?w+'" + ':''}${k}/16"${k?` = ${w?w+' ':''}${k*8}/128"`:''}`;
  return `Escala fixa: ${w?`<b>${w}"</b> e `:''}<b>${k}</b> divisões de 1/16" (${esc}). Nônio: ${r?`${r}º traço = <b>${r}/128"</b>`:'o zero coincide, nada a somar'}. Soma em 128 avos: ${w?w+' ':''}${k*8}/128 + ${r}/128 = ${w?w+' ':''}${k*8+r}/128${(k*8+r)&&(k*8+r)%2===0?` → simplificando: ${simpChain(k*8+r,128)}`:(k*8+r)?' (numerador ímpar: já está simplificada)':''} → leitura <b>${fTxt(u)}</b>`}

/* ---------- desenho ---------- */
const zeroX=()=>(S.p-S.cam)*PPU;
function follow(){const x=zeroX();if(x<MARG)S.cam=S.p-MARG/PPU;else if(x>W-VL-MARG)S.cam=S.p-(W-VL-MARG)/PPU}
const centerCam=()=>{S.cam=S.p-ZX/PPU};
function drawBeam(){let h='';
  const first=Math.max(0,Math.floor(S.cam/FD)-1),last=Math.ceil((S.cam+W/PPU)/FD)+1,maxm=6.5*16;
  for(let m=first;m<=Math.min(last,maxm);m++){const x=(m*FD-S.cam)*PPU;if(x<BX0||x>BX1)continue;
    const L=m%16===0?225:m%8===0?180:m%4===0?145:m%2===0?112:82;
    h+=`<line x1="${x}" x2="${x}" y1="${LINE-L}" y2="${LINE}" stroke="#2A2829" stroke-width="${m%16===0?5:3.4}"/>`;
    if(m%16===0){const lab=m/16,half=66*0.32*String(lab).length+4;
      if(x-half>BX0+6&&x+half<BX1-6)h+=`<text x="${x}" y="${LINE-L-10}" text-anchor="middle" font-size="66" font-weight="900" font-family="'Arial Black',Arial,Helvetica,sans-serif" fill="#14202B">${lab}</text>`}}
  const inch=Math.floor(S.cam/128),xi=(inch*128-S.cam)*PPU;
  if(S.cam>0&&xi<BX0+40)h+=`<rect x="${BX0+8}" y="${BX0+8}" width="150" height="54" rx="6" fill="#14202B" opacity=".85"/><text x="${BX0+83}" y="${BX0+46}" text-anchor="middle" font-size="34" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#F2A93B">◂ ${inch}"</text>`;
  $('beam').innerHTML=h}
function drawPlate(){const z=zeroX(),x0=z-110,x1=z+VL+110,yb=LINE+230;
  let h=`<rect x="${x0}" y="${LINE}" width="${x1-x0}" height="230" fill="#E6E7E8"/><path d="M${x0} ${LINE} V${yb-6} Q${x0} ${yb} ${x0+6} ${yb} H${x1-6} Q${x1} ${yb} ${x1} ${yb-6} V${LINE}" fill="none" stroke="#373435" stroke-width="5"/>`;
  for(let k=0;k<=ND;k++){const x=z+k*VD,lab=k%4===0;
    h+=`<line x1="${x}" x2="${x}" y1="${LINE}" y2="${LINE+(lab?120:80)}" stroke="#2A2829" stroke-width="${k===0?5:3.4}"/>`;
    if(lab)h+=`<text x="${x}" y="${LINE+170}" text-anchor="middle" font-size="40" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#2A2829">${k}</text>`}
  h+=`<text x="${x1-14}" y="${LINE+214}" text-anchor="end" font-size="26" font-family="Arial,Helvetica,sans-serif" fill="#4A4849">1/128 in</text>`;
  $('plate').innerHTML=h}
function drawGuide(){const n=Math.floor(S.p/FD),r=S.p%FD,z=zeroX();let g='';
  const full=S.mode==='explore'?S.guide:S.answered,showHint=S.hint&&!S.answered,pink=S.mode==='basic'&&!S.answered&&S.task==='read';
  if(full||showHint){const xm=(n*FD-S.cam)*PPU;if(xm>BX0&&xm<BX1)g+=`<line x1="${xm}" x2="${xm}" y1="${LINE-240}" y2="${LINE-4}" stroke="#E07B00" stroke-width="7" stroke-dasharray="20 14" opacity=".85"/>`}
  if(full||pink){const xa=z+r*VD,col=pink?'#FF2E93':'#E07B00';
    g+=`<line x1="${xa}" x2="${xa}" y1="${LINE-200}" y2="${LINE+118}" stroke="${col}" stroke-width="7" opacity=".6"/><circle cx="${xa}" cy="${LINE+132}" r="11" fill="${col}"/>`}
  $('guide').innerHTML=g}
function draw(){drawBeam();drawPlate();drawGuide();
  const can=canMove();Z.classList.toggle('fixed',!can);document.querySelectorAll('#ctl button').forEach(b=>b.disabled=!can);
  Z.setAttribute('aria-valuetext',can?fTxt(S.p):'cursor fixo')}

/* ---------- movimento ---------- */
const canMove=()=>S.mode==='explore'||(S.task==='adjust'&&!S.answered&&!S.done);
function setP(p){p=Math.max(0,Math.min(MAX,Math.round(p)));if(p===S.p)return;S.p=p;follow();draw();if(S.mode==='explore')panelExplore()}
const svgX=e=>{const pt=Z.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(Z.getScreenCTM().inverse()).x};
let drag=null;
Z.addEventListener('pointerdown',e=>{if(!canMove())return;drag={x:svgX(e),p:S.p};Z.setPointerCapture(e.pointerId);Z.classList.add('drag');Z.focus()});
Z.addEventListener('pointermove',e=>{if(drag)setP(drag.p+(svgX(e)-drag.x)/PPU)});
['pointerup','pointercancel'].forEach(v=>Z.addEventListener(v,()=>{drag=null;Z.classList.remove('drag')}));
Z.addEventListener('keydown',e=>{if(!canMove())return;const d={ArrowLeft:-1,ArrowDown:-1,ArrowRight:1,ArrowUp:1,PageUp:FD,PageDown:-FD}[e.key];if(d){e.preventDefault();setP(S.p+d)}});
document.querySelectorAll('#ctl button').forEach(b=>b.onclick=()=>setP(S.p+ +b.dataset.d));

/* ---------- respostas ---------- */
const val=id=>{const x=($(id)?.value||'').trim();return x===''?null:x};
function readFrac(){const w=val('aw'),n=val('an'),d=val('ad');if(w===null&&n===null)return null;
  const Wv=w===null?0:parseInt(w,10),N=n===null?0:parseInt(n,10),D=n===null?1:parseInt(d===null?'':d,10);
  if([Wv,N].some(x=>isNaN(x)||x<0)||isNaN(D)||D<=0)return{bad:true};
  return{u:(Wv*D+N)*128/D,simp:N===0||(gcd(N,D)===1&&N<D),txt:(Wv?Wv+(N?' ':''):'')+(N?N+'/'+D:'')+'"'}}
const fracIn=`<span class="fin"><input class="n w" id="aw" inputmode="numeric" autocomplete="off" aria-label="Polegadas inteiras"><span class="fstack"><input class="n f" id="an" inputmode="numeric" autocomplete="off" aria-label="Numerador"><i></i><input class="n f" id="ad" inputmode="numeric" autocomplete="off" aria-label="Denominador"></span><span class="unit">"</span></span>`;
function readMm(){const v=parseFloat((val('amm')||'').replace(',','.'));return isNaN(v)?null:v}
const howTo=`<details class="how"><summary>Como ler (passo a passo)</summary><ol>
<li>Escala fixa: veja a última polegada inteira e conte as divisões de 1/16" até o zero do nônio.</li>
<li>Nônio: ache o traço que coincide com um traço da escala fixa. Cada traço vale 1/128".</li>
<li>Passe a escala fixa para 128 avos (multiplique as divisões por 8, porque 1/16 = 8/128) e some com o nônio.</li>
<li>Simplifique: divida em cima e embaixo por 2 enquanto der.</li></ol>
<table class="tab8"><tr><th>Traço do nônio</th><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td></tr><tr><th>Vale</th><td>1/128</td><td>1/64</td><td>3/128</td><td>1/32</td><td>5/128</td><td>3/64</td><td>7/128</td><td>1/16</td></tr></table></details>`;

/* ---------- Explorar ---------- */
function panelExplore(){
  P.innerHTML=`<div class="big">${fHTML(S.p)}</div><p class="eq">${explain(S.p)}</p><p class="eq">Em milímetros: <b>${mmTxt(mm(S.p))}</b> (× 25,4)</p>
  <div class="row"><label class="chk"><input type="checkbox" id="g" ${S.guide?'checked':''}> Mostrar guias</label><button class="act ghost" id="rz">Fechar (zerar)</button></div>${howTo}`;
  $('g').onchange=e=>{S.guide=e.target.checked;draw()};
  $('rz').onclick=()=>{S.p=0;S.cam=-MARG/PPU;draw();panelExplore()}}

/* ---------- jogo ---------- */
function genValue(){let lo,hi;
  if(S.mode==='basic'){lo=1;hi=255}else if(S.mode==='medio'){lo=8;hi=512}else{lo=64;hi=MAX-8}
  let u,t=0;do{u=rnd(lo,hi);t++}while(t<500&&((S.used&&S.used.has(u))||u===S.p||(u%FD===0&&Math.random()<.85)));if(S.used)S.used.add(u);return u}
function newRound(){S.answered=false;S.hint=false;S.last=null;
  S.task=S.mode==='avancado'?(S.round%2?'adjust':'convert'):'read';
  if(S.task==='adjust'){S.target=genValue();S.p=rnd(0,40)}else S.p=genValue();
  centerCam();draw()}
function startGame(){S.used=new Set();S.played=0;S.round=1;S.score=0;S.correct=0;S.streak=0;S.done=false;newRound();panelGame()}
const key=()=>`paqpol-fr-${S.mode}`;
function loadBest(){try{S.best=+localStorage.getItem(key())||0}catch(e){S.best=0}}
const stats=()=>`<div class="stats"><span>Rodada<b>${Math.min(S.round,RN())}/${RN()}</b></span><span>Pontos<b>${S.score}</b></span><span>Sequência<b>${S.streak}</b></span><span>Recorde<b>${S.best}</b></span></div>`;
const levelName={basic:'Básico',medio:'Médio',avancado:'Avançado'};
function record(pts,ok,last){S.answered=true;S.played++;S.score+=pts;S.streak=ok?S.streak+1:0;if(ok)S.correct++;S.last=last;draw();panelGame();const n=$('next');if(n)n.focus()}

/* Básico: escala fixa (polegadas + divisões de 1/16) e nônio (traço/128), com soma automática */
function bVals(){const w=val('bw'),k=val('bk'),r=val('br');const Wv=w===null?0:parseInt(w,10),K=k===null?0:parseInt(k,10),R=r===null?0:parseInt(r,10);
  return{empty:w===null&&k===null,rEmpty:r===null,bad:[Wv,K,R].some(x=>isNaN(x)||x<0),Wv,K,R}}
function updBasic(){const o=$('bsum');if(!o)return;const v=bVals();if(v.empty||v.rEmpty||v.bad){o.innerHTML='—';return}
  const u=v.Wv*128+v.K*8+v.R;o.innerHTML=`${v.Wv?v.Wv+' ':''}${v.K*8+v.R}/128" = ${fHTML(u)}`}
function checkBasic(){const v=bVals();if(v.empty||v.bad){$('bk').focus();return}if(v.rEmpty){$('br').focus();return}
  const n=Math.floor(S.p/FD),fOk=v.Wv===Math.floor(n/16)&&v.K===n%16,nOk=v.R===S.p%FD,pts=(fOk?5:0)+(nOk?5:0);
  record(pts,fOk&&nOk,{basic:true,fOk,nOk,fTxt:rawTxt(v.Wv*16+v.K,16),nTxt:v.R+'/128"',pts})}
function checkRead(){const a=readFrac();if(!a||a.bad){$('an').focus();return}
  const d=Math.abs(a.u-S.p),exact=d<1e-9,near=!exact&&d<=1+1e-9;let pts=exact?(a.simp?10:7):near?3:0;if(S.hint&&pts)pts=Math.max(0,pts-3);
  record(pts,exact&&a.simp,{exact,simp:a.simp,txt:a.txt,pts})}
function checkAdjust(){const d=S.p-S.target,ok=d===0,pts=ok?10:Math.abs(d)===1?3:0;record(pts,ok,{exact:ok,txt:fTxt(S.p),pts})}
function checkConvert(){const a=readFrac(),m=readMm();if(!a||a.bad){$('an').focus();return}if(m===null){$('amm').focus();return}
  const exact=Math.abs(a.u-S.p)<1e-9,mmOk=Math.abs(m-mm(S.p))<=0.011,mmNear=!mmOk&&Math.abs(m-mm(S.p))<=0.06;
  let pr=exact?(a.simp?5:4):0,pm=mmOk?5:mmNear?2:0;if(S.hint)pr=Math.max(0,pr-3);
  record(pr+pm,exact&&a.simp&&mmOk,{exact,simp:a.simp,txt:a.txt,mmOk,mmTxt:m.toFixed(2).replace('.',','),pts:pr+pm})}
/* colocação de medida (Telecurso): fração em 128 avos, numerador ÷ 8 */
function placeTip(u){const w=Math.floor(u/128),n=u%128,q=Math.floor(n/8),r=n%8;const {n:sn,d:sd}=parts(u);
  return `Para abrir: ${w?w+'" inteiras; ':''}${sn&&sd!==128?`${sn}/${sd} = ${n}/128; `:''}${n} ÷ 8 = ${q}, resto ${r} → ${q} divisões de 1/16" na escala fixa e o ${r}º traço do nônio coincidindo.`}

/* conta armada da resposta: escala fixa + nônio = leitura */
function conta(u,sua){const n=Math.floor(u/FD),r=u%FD,w=Math.floor(n/16),k=n%16;
  const certa=`<div class="conta"><span class="tt">Resposta certa</span>
   <span class="op"></span><span class="v">${rawTxt(w*16+k,16)}</span><span class="m">escala fixa${k?` = ${rawTxt(w*128+k*8,128)}`:''}</span>
   <span class="op">+</span><span class="v">${r}/128"</span><span class="m">nônio, ${r}º traço</span><hr>
   <span class="op">=</span><span class="v">${rawTxt(u,128)}</span><span class="m">${parts(u).d!==128&&u%128?'= '+fTxt(u)+' simplificado':''}</span></div>`;
  return `<div class="contas">${sua||''}${certa}</div>`}
function suaBasic(l){const mk=ok=>`<span class="m ${ok?'ok':'no'}">${ok?'✓ certo':'✗ errado'}</span>`;
  return `<div class="conta"><span class="tt">Sua resposta</span><span class="op"></span><span class="v${l.fOk?'':' no'}">${l.fTxt}</span>${mk(l.fOk)}<span class="op">+</span><span class="v${l.nOk?'':' no'}">${l.nTxt}</span>${mk(l.nOk)}</div>`}

function panelGame(){
  if(S.done){const nb=S.score>S.best;if(nb){S.best=S.score;try{localStorage.setItem(key(),S.best)}catch(e){}}
    const jog=S.played||1,max=jog*10,pc=S.score/max*100;
    const msg=pc>=90?'Mão de metrologista.':pc>=70?'Leitura firme. Cuidado com a soma e a simplificação.':pc>=40?'Bom caminho. Passe tudo para 128 avos antes de somar.':'Volte ao modo Explorar com as guias ligadas e tente de novo.';
    P.innerHTML=`<div class="big">${S.score}<small>de ${max} pontos</small></div><p>${levelName[S.mode]} · polegada fracionária. ${S.correct}/${jog} acertos. ${msg}${nb&&S.score>0?' Novo recorde.':''}</p>
    <div class="row"><button class="act" id="again">Jogar de novo</button><button class="act ghost" id="copyres">Copiar resultado</button><span id="copied" class="copied" style="display:none">Copiado!</span></div>`;
    $('again').onclick=startGame;
    $('copyres').onclick=()=>{const t=`Paquímetro em polegada fracionária — ${levelName[S.mode]}: ${S.score}/${max} pontos — ${S.correct}/${jog} acertos — ${new Date().toLocaleDateString('pt-BR')}`;
      (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove()})
      .finally(()=>{const c=$('copied');c.style.display='inline';setTimeout(()=>c.style.display='none',1800)})};
    return}
  const l=S.last;let h=stats();
  h+=`<span class="task">${{read:'Leitura',adjust:'Abrir na medida',convert:'Ler e converter'}[S.task]}</span>`;
  if(S.task==='read'&&S.mode==='basic'){
    h+=`<p style="margin:0 0 6px">Qual é a leitura? A <b style="color:#FF2E93">linha rosa</b> mostra o traço do nônio que coincide. Escreva a escala fixa (polegadas e divisões de 1/16") e o traço do nônio: a soma em 128 avos e a simplificação aparecem sozinhas.</p>`;
    if(!S.answered)h+=`<div class="soma"><span class="op"></span><span class="fin"><input class="n w" id="bw" inputmode="numeric" autocomplete="off" aria-label="Polegadas inteiras da escala fixa"><span class="cnt">"</span><input class="n w" id="bk" inputmode="numeric" autocomplete="off" aria-label="Divisões de 1/16 da escala fixa"><span class="cnt">/16"</span></span><span class="lb">Escala fixa</span>
      <span class="op">+</span><span class="fin"><input class="n w" id="br" inputmode="numeric" autocomplete="off" aria-label="Traço do nônio"><span class="cnt">/128"</span></span><span class="lb">Nônio</span>
      <hr><span class="op">=</span><output id="bsum" aria-live="polite">—</output><span class="lb">Soma automática</span></div><div class="row"><button class="act" id="ok">Conferir</button></div>`}
  else if(S.task==='read'){
    h+=`<p style="margin:0 0 6px">Qual é a leitura do paquímetro? Some a escala fixa com o nônio e escreva a fração <b>simplificada</b>.</p>`;
    if(!S.answered)h+=`<div class="row">${fracIn}<button class="act" id="ok">Conferir</button><button class="act ghost" id="hint" ${S.hint?'disabled':''}>Dica (−3)</button></div>`}
  else if(S.task==='adjust'){
    h+=`<p style="margin:0 0 6px">Abra o paquímetro na medida abaixo. Arraste a escala ou use os botões e confira.</p><div class="big">${fHTML(S.target)}</div>`;
    if(!S.answered)h+=`<div class="row"><button class="act" id="ok">Conferir</button></div>`}
  else{
    h+=`<p style="margin:0 0 6px">Leia a medida (fração simplificada) e converta para milímetro (× 25,4, duas casas decimais).</p>`;
    if(!S.answered)h+=`<div class="row" style="align-items:flex-end"><div><span class="lbl">Leitura</span>${fracIn}</div><div><span class="lbl">Em milímetros</span><span class="fin"><input class="n" id="amm" inputmode="decimal" autocomplete="off" aria-label="Medida em milímetros" style="width:6.5ch"><span class="unit">mm</span></span></div><button class="act" id="ok">Conferir</button><button class="act ghost" id="hint" ${S.hint?'disabled':''}>Dica (−3)</button></div>`}
  if(S.hint&&!S.answered){const n=Math.floor(S.p/FD);h+=`<p class="eq">Dica: a escala fixa marca <b>${rawTxt(n,16)}</b> = <b>${rawTxt(n*8,128)}</b> (linha tracejada). Falta achar o traço do nônio que coincide.</p>`}
  if(S.answered){const ok=l.pts>=10;let body='';
    if(l.basic)body=conta(S.p,suaBasic(l));
    else if(S.task==='read')body=(l.exact?(l.simp?`Você respondeu ${l.txt}.`:`Você respondeu ${l.txt}: o valor está certo, mas falta simplificar para <b>${fTxt(S.p)}</b>.`):`Você respondeu ${l.txt}. O certo era <b>${fTxt(S.p)}</b>.`)+conta(S.p);
    else if(S.task==='adjust')body=(l.exact?`O paquímetro marca exatamente ${fTxt(S.target)}.`:`Você deixou em ${l.txt}; o pedido era <b>${fTxt(S.target)}</b>.`)+`<p class="eq">${placeTip(S.target)}</p>`;
    else body=`Leitura: ${l.exact?(l.simp?'certa':'certa, mas falta simplificar para '+fTxt(S.p)):`você escreveu ${l.txt}, o certo era <b>${fTxt(S.p)}</b>`}. Milímetros: ${l.mmOk?'certo':`você escreveu ${l.mmTxt} mm, o certo era <b>${mmTxt(mm(S.p))}</b>`}.${conta(S.p)}<p class="eq">Conversão: ${S.p}/128 × 25,4 = ${(S.p*25.4).toFixed(1).replace('.',',')} ÷ 128 = <b>${mmTxt(mm(S.p))}</b></p>`;
    h+=`<div class="fb ${ok?'ok':'no'}"><strong>${ok?'Certo!':l.pts?'Quase.':'Não foi dessa vez.'} +${l.pts}</strong><br>${body}<p class="eq">${explain(S.p)}</p></div>
    <div class="row"><button class="act" id="next">${S.round>=RN()?'Ver resultado':'Próxima'}</button>${S.round<RN()?'<button class="act ghost" id="stop">Terminar agora e ver resultado</button>':''}</div>`}
  h+=howTo;P.innerHTML=h;
  const ok=$('ok');
  if(ok){ok.onclick=S.task==='read'?(S.mode==='basic'?checkBasic:checkRead):S.task==='adjust'?checkAdjust:checkConvert;
    P.querySelectorAll('input.n').forEach(i=>{i.onkeydown=e=>{if(e.key==='Enter')ok.click()};i.oninput=updBasic});
    const f=P.querySelector('input.n');if(f)f.focus({preventScroll:true})}
  if($('hint'))$('hint').onclick=()=>{S.hint=true;draw();panelGame()};
  if($('stop'))$('stop').onclick=()=>{S.done=true;draw();panelGame()};
  if($('next'))$('next').onclick=()=>{if(S.round>=RN()){S.done=true;draw();panelGame()}else{S.round++;newRound();panelGame()}}}

/* ---------- abas ---------- */
const mtabs=[...document.querySelectorAll('.tabs button')];
function setMode(m){S.mode=m;S.done=false;S.answered=false;S.hint=false;S.task='read';
  mtabs.forEach(b=>b.setAttribute('aria-selected',b.dataset.m===m));loadBest();
  if(m==='explore'){centerCam();draw();panelExplore()}else startGame()}
mtabs.forEach(b=>b.onclick=()=>setMode(b.dataset.m));
setMode('explore');
</script>
</body>
</html>
