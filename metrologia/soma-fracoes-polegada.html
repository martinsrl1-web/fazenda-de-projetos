<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Soma de Frações da Polegada</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Big+Shoulders+Display:wght@700;800&display=swap">
<style>
:root{--bg:#E4EAEF;--panel:#F5F8FA;--ink:#14202B;--muted:#4F5F6C;--line:#B8C4CE;--accent:#A85400;--accent-ink:#fff;--ok:#17703F;--bad:#B3261E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1926;--panel:#132638;--ink:#E8EEF3;--muted:#98AAB9;--line:#2A4258;--accent:#F2A93B;--accent-ink:#1a1204;--ok:#5FD08F;--bad:#FF8A80}}
:root[data-theme="dark"]{--bg:#0D1926;--panel:#132638;--ink:#E8EEF3;--muted:#98AAB9;--line:#2A4258;--accent:#F2A93B;--accent-ink:#1a1204;--ok:#5FD08F;--bad:#FF8A80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 Barlow,'Arial Narrow',Arial,sans-serif}
main{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
h1{font:800 clamp(36px,8vw,60px)/.95 'Big Shoulders Display','Arial Narrow',Impact,sans-serif;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 14px;max-width:66ch}
.stage{background:#1D3B5C;border-radius:6px;padding:10px 4px 4px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.stage svg{display:block;width:100%;height:auto;margin:0 auto}
#zoom{cursor:grab;max-height:50dvh}#zoom.fixed{cursor:default}#zoom.drag{cursor:grabbing}
.ctl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:8px 0 4px}
.ctl button{font:700 18px/1 'Big Shoulders Display','Arial Narrow',sans-serif;min-width:62px;min-height:44px;padding:0 8px;border-radius:4px;border:1px solid #4E6E8E;background:#24486E;color:#E8EEF3;cursor:pointer;font-variant-numeric:tabular-nums}
.ctl button:disabled{opacity:.35;cursor:default}
.ctl i{width:12px}
.rot{display:none;color:#BFD3E6;font-size:14px;text-align:center;margin:2px 0 0}
.tabs{display:flex;margin:14px 0 12px;border:2px solid var(--ink);border-radius:4px;overflow:hidden;width:fit-content;max-width:100%}
.tabs button{font:700 20px/1 'Big Shoulders Display','Arial Narrow',sans-serif;letter-spacing:.03em;padding:11px 18px;min-height:48px;background:transparent;color:var(--ink);border:0;cursor:pointer}
.tabs button+button{border-left:2px solid var(--ink)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px}
.big{font:800 clamp(48px,12vw,88px)/.95 'Big Shoulders Display','Arial Narrow',sans-serif;font-variant-numeric:tabular-nums}
.big small{font-size:.38em;margin-left:.2em;color:var(--muted)}
.stats{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:12px;color:var(--muted)}
.stats b{display:block;font:800 28px/1 'Big Shoulders Display',sans-serif;color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
button.act{font:700 19px/1 'Big Shoulders Display','Arial Narrow',sans-serif;letter-spacing:.03em;padding:13px 22px;min-height:48px;border-radius:4px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input.n{font:800 40px/1 'Big Shoulders Display',sans-serif;min-height:54px;padding:4px 8px;border:2px solid var(--ink);border-radius:4px;background:var(--bg);color:var(--ink);text-align:right;width:6.5ch}
.fin{display:inline-flex;align-items:center;gap:8px}
.unit{font:800 30px/1 'Big Shoulders Display',sans-serif;color:var(--muted)}
.soma{display:grid;grid-template-columns:auto auto auto;gap:8px 12px;align-items:center;justify-content:start;margin-top:10px}
.soma .op{font:800 34px/1 'Big Shoulders Display',sans-serif;color:var(--muted);text-align:right}
.soma .lb{font-size:15px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.soma hr{grid-column:1/-1;width:100%;border:0;border-top:3px solid var(--ink);margin:2px 0}
.soma output{font:800 44px/1 'Big Shoulders Display',sans-serif;font-variant-numeric:tabular-nums;text-align:right;padding-right:10px}
.contas{display:flex;gap:16px 36px;flex-wrap:wrap;margin-top:10px}
.conta{display:grid;grid-template-columns:auto auto auto;gap:2px 10px;align-items:baseline;padding:10px 16px;border-radius:6px;background:var(--panel);border:1px solid var(--line)}
.conta .tt{grid-column:1/-1;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.conta .op{font:800 30px/1.1 'Big Shoulders Display',sans-serif;color:var(--muted);text-align:right}
.conta .v{font:800 34px/1.1 'Big Shoulders Display',sans-serif;font-variant-numeric:tabular-nums;text-align:right}
.conta .m{font-size:14px;font-weight:700}
.conta .m.ok{color:var(--ok)}.conta .m.no{color:var(--bad)}
.conta .v.no{color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px}
.conta hr{grid-column:1/-1;width:100%;border:0;border-top:3px solid var(--ink);margin:2px 0}
.lbl{font-size:14px;color:var(--muted);display:block;margin-bottom:2px;letter-spacing:.06em;text-transform:uppercase}
.fb{margin-top:12px;padding:12px 14px;border-left:6px solid var(--line);background:var(--bg);border-radius:0 4px 4px 0}
.fb.ok{border-color:var(--ok)}.fb.no{border-color:var(--bad)}
.eq{color:var(--muted);margin:8px 0 0}.eq b{color:var(--ink)}
label.chk{display:flex;gap:8px;align-items:center;cursor:pointer}
details.how{margin-top:12px;border-top:1px solid var(--line);padding-top:8px;color:var(--muted)}
details.how summary{cursor:pointer;font-weight:600;color:var(--ink)}
details.how ol{margin:6px 0 0;padding-left:22px}
.copied{color:var(--ok);font-weight:700;margin-left:8px}
.task{display:inline-block;font:700 14px/1 Barlow,sans-serif;letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:5px 8px;border-radius:3px;margin-bottom:8px}
@media (max-width:640px){.tabs{width:100%}.tabs button{flex:1;padding:11px 4px;font-size:17px}.row .act{flex:1 1 auto}.ctl button{min-width:56px;font-size:16px}.ctl i{display:none}}
@media (orientation:portrait) and (max-width:640px){.rot{display:block}}
@media (orientation:landscape) and (max-height:820px){
 main{padding:10px 18px 18px;max-width:1200px}h1{font-size:34px;margin:0 0 6px}.sub{display:none}
 #zoom{max-height:44dvh}.tabs{margin:8px 0}.tabs button{padding:8px 16px;min-height:42px;font-size:18px}
 .panel{padding:12px 16px}.stats{margin-bottom:6px}.stats b{font-size:24px}.big{font-size:54px}.row{margin-top:8px}.fb{margin-top:8px;padding:8px 12px}
}
@media (prefers-reduced-motion:no-preference){.fb{animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(4px);opacity:.4}}}

/* Cabeçalho comum do site Fazenda de Projetos */
.fp-in{max-width:1000px;margin-inline:auto;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px 20px;flex-wrap:wrap}
.fp-brand{font:800 27px/1 'Big Shoulders Display','Arial Narrow',Impact,sans-serif;letter-spacing:.04em;text-transform:uppercase;text-decoration:none;color:var(--ink)}
.fp-brand b{color:var(--accent);font-weight:800}
.fp-onde{font:600 13.5px/1.2 Barlow,'Arial Narrow',Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fp-rule{height:24px;border-block:1px solid var(--line);
  background-image:linear-gradient(90deg,var(--ink) 0 2px,transparent 2px),linear-gradient(90deg,var(--muted) 0 1px,transparent 1px),linear-gradient(90deg,var(--muted) 0 1px,transparent 1px);
  background-size:80px 100%,40px 62%,8px 36%;background-repeat:repeat-x;background-position:16px 0}
.passos{display:flex;flex-direction:column;gap:14px;margin-top:12px}
.passo{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.passo .pn{font:800 22px/1 'Big Shoulders Display',sans-serif;background:var(--accent);color:var(--accent-ink);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;flex:none}
.passo .pt{font-size:17px;color:var(--muted);min-width:150px}
.passo .ex{font:800 30px/1 'Big Shoulders Display',sans-serif;display:inline-flex;align-items:center;gap:8px}
.fin .fstack{display:inline-flex;flex-direction:column;align-items:center;gap:4px}
.fin .fstack i{display:block;width:100%;height:3px;background:var(--ink);border-radius:2px}
.fixd{font:800 30px/1 'Big Shoulders Display',sans-serif;min-height:40px;display:flex;align-items:center}
input.n.w{width:2.4ch;font-size:34px;min-height:50px;text-align:center}
input.n.f{width:3.4ch;font-size:28px;min-height:42px;text-align:center}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;font-size:.6em;margin:0 .06em}
.fr span:first-child{border-bottom:.08em solid currentColor;padding:0 .12em .06em}
.fr span:last-child{padding-top:.06em}
.conta .v .fr{font-size:.62em}
.pick{display:flex;gap:28px;flex-wrap:wrap;align-items:center;margin-top:8px}
.pick .grp{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.pick button{font:800 22px/1 'Big Shoulders Display',sans-serif;min-width:40px;min-height:40px;border-radius:4px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.pick select{font:700 20px/1 Barlow,sans-serif;min-height:40px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);padding:4px 6px}
.pick .val{font:800 40px/1 'Big Shoulders Display',sans-serif;min-width:3ch;text-align:center}
.bigop{font:800 40px/1 'Big Shoulders Display',sans-serif;color:var(--muted)}
.lista{margin:6px 0 0;padding-left:22px}
.lista li{margin:4px 0}

/* Correção bem visível: verde com ✓ quando acerta, vermelho com ✗ quando erra */
.fb.ok,.fb.no{border-left-width:8px;padding:14px 16px;display:flow-root}
.fb.ok{background:color-mix(in srgb,var(--ok) 13%,var(--bg))}
.fb.no{background:color-mix(in srgb,var(--bad) 12%,var(--bg))}
.fb.ok::before,.fb.no::before{content:'✓';float:left;width:58px;height:58px;border-radius:50%;background:#17703F;color:#fff;font:800 38px/58px Arial,sans-serif;text-align:center;margin:0 14px 6px 0}
.fb.no::before{content:'✗';background:#B3261E}
.fb.ok>strong:first-child,.fb.ok>b:first-child{color:#17703F;font-size:24px}
.fb.no>strong:first-child,.fb.no>b:first-child{color:#B3261E;font-size:24px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fb.ok>strong:first-child,:root:not([data-theme="light"]) .fb.ok>b:first-child{color:var(--ok)}:root:not([data-theme="light"]) .fb.no>strong:first-child,:root:not([data-theme="light"]) .fb.no>b:first-child{color:var(--bad)}}
.conta .m.ok,.conta .m.no{color:#fff;border-radius:12px;padding:3px 9px;font-size:14px;white-space:nowrap}
.conta .m.ok{background:#17703F}.conta .m.no{background:#B3261E}
.par b.okc::before{content:'✓ ';}.par b.noc::before{content:'✗ ';}
.mmc{border-collapse:collapse;font:800 30px/1 'Big Shoulders Display',sans-serif;font-variant-numeric:tabular-nums}
.mmc td{padding:4px 8px;text-align:center;min-width:2.4ch}
.mmc td.dv{border-left:4px solid var(--ink);padding-left:12px}
.mmc input.n.f{width:2.6ch}
.mmc td.c-ok{color:var(--ok)}.mmc td.c-no{color:var(--bad);text-decoration:line-through}
.mmcres{display:flex;align-items:center;gap:10px;font:800 30px/1 'Big Shoulders Display',sans-serif;margin-top:6px}
.armada{display:grid;grid-template-columns:auto auto auto auto;gap:6px 10px;align-items:center;font:800 30px/1 'Big Shoulders Display',sans-serif}
.armada .op{color:var(--muted);text-align:right;min-width:1ch}
.armada hr{grid-column:1/-1;width:100%;border:0;border-top:3px solid var(--ink);margin:2px 0}
.armada .eqs{color:var(--muted)}
.mmcd{min-width:2ch;text-align:center}
.armada .fr{font-size:.95em}
.passo.col{flex-direction:column;align-items:flex-start}
.passo .cab{display:flex;align-items:center;gap:14px}
.fbt{margin-top:10px}.fbt .tt{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
</style>
</head>
<body>
<header class="fp-top">
  <div class="fp-in"><a class="fp-brand" href="../index.html">Fazenda <b>de Projetos</b></a><span class="fp-onde">Metrologia · Polegada fracionária</span></div>
  <div class="fp-rule" aria-hidden="true"></div>
</header>
<main>
<h1>Soma de Frações da Polegada</h1>
<p class="sub">Para praticar, sem nota. Revisão para o paquímetro em polegada fracionária: iguale os denominadores, some os numeradores e simplifique. A barra mostra as duas medidas, uma depois da outra, dentro da polegada.</p>
<div class="stage" style="padding:10px 8px 6px"><svg id="bar" viewBox="0 0 2000 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Barra de polegada com as frações somadas"></svg></div>
<div class="tabs" role="tablist" aria-label="Modo">
  <button role="tab" data-m="explore">Explorar</button>
  <button role="tab" data-m="n1">Nível 1</button>
  <button role="tab" data-m="n2">Nível 2</button>
</div>
<section class="panel" id="panel" aria-live="polite"></section>
</main>
<script>
/* Frações como {w,n,d}; valores internos em 1/128 de polegada (inteiros). */
const $=id=>document.getElementById(id),P=$('panel'),BAR=$('bar');
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[rnd(0,a.length-1)];
const RN=()=>({n1:20,n2:20})[S.mode]||10;
const S={mode:'explore',A:{w:0,n:1,d:4},B:{w:0,n:3,d:16},round:1,score:0,correct:0,streak:0,best:0,done:false,answered:false,played:0,last:null,used:null};
const to128=f=>f.w*128+f.n*128/f.d;
function simp(u){const w=Math.floor(u/128);let n=u%128,d=128;if(n){const g=gcd(n,d);n/=g;d/=g}return{w,n,d}}
const fH=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
function mixH(f){return f.n?`${f.w?f.w:''}${fH(f.n,f.d)}"`:`${f.w}"`}
function mixT(f){return f.n?`${f.w?f.w+' ':''}${f.n}/${f.d}"`:`${f.w}"`}
const uH=u=>mixH(simp(u)),uT=u=>mixT(simp(u));
function cadeia(n,d){let s=`${n}/${d}`;while(n&&n%2===0&&d>1){n/=2;d/=2;s+=` = ${n}/${d}`}return s}

/* ---------- barra da polegada ---------- */
function drawBar(A,B,showSum){const ua=to128(A),ub=to128(B),tot=ua+ub,span=Math.max(1,Math.ceil(tot/128-1e-9)),X0=60,Wd=1880,px=Wd/(span*128);
  const dc=Math.max(A.d,B.d);let h='';
  h+=`<rect x="${X0}" y="70" width="${Wd}" height="120" fill="#D9DBDD" stroke="#373435" stroke-width="4"/>`;
  h+=`<rect x="${X0}" y="70" width="${ua*px}" height="120" fill="#5B8DC9"/><rect x="${X0+ua*px}" y="70" width="${ub*px}" height="120" fill="#F2A93B"/>`;
  for(let k=0;k<=span*dc;k++){const x=X0+k*Wd/(span*dc),inch=k%dc===0;h+=`<line x1="${x}" x2="${x}" y1="${inch?50:70}" y2="${inch?210:190}" stroke="#2A2829" stroke-width="${inch?5:(dc>32?1.2:2.4)}"/>`;
    if(inch)h+=`<text x="${x}" y="40" text-anchor="middle" font-size="34" font-weight="900" font-family="'Arial Black',Arial,sans-serif" fill="#E8EEF3">${k/dc}"</text>`}
  const lab=(x,w,t,c)=>w>140?`<text x="${x+w/2}" y="142" text-anchor="middle" font-size="36" font-weight="700" font-family="Arial,sans-serif" fill="${c}">${t}</text>`:'';
  h+=lab(X0,ua*px,mixT(A),'#fff')+lab(X0+ua*px,ub*px,mixT(B),'#14202B');
  if(showSum){const xe=X0+tot*px;h+=`<line x1="${xe}" x2="${xe}" y1="40" y2="250" stroke="#FF2E93" stroke-width="6"/><text x="${Math.min(Math.max(xe,180),1820)}" y="285" text-anchor="middle" font-size="38" font-weight="700" font-family="Arial,sans-serif" fill="#FF8DC4">soma = ${uT(tot)}</text>`}
  h+=`<text x="${X0}" y="285" font-size="26" font-family="Arial,sans-serif" fill="#BFD3E6">divisões de 1/${dc}"</text>`;
  BAR.innerHTML=h}

/* ---------- resolução completa (texto) ---------- */
function resolve(A,B){const D=Math.max(A.d,B.d),na=A.n*D/A.d,nb=B.n*D/B.d,w=A.w+B.w,s=na+nb,tot=to128(A)+to128(B);const L=[];
  if(A.d!==B.d)L.push(`MMC de ${A.d} e ${B.d} = ${D}`);
  if(A.d!==B.d)L.push(`Iguale os denominadores: ${A.d!==D?`${A.n}/${A.d} = ${na}/${D} (× ${D/A.d})`:''}${B.d!==D?`${B.n}/${B.d} = ${nb}/${D} (× ${D/B.d})`:''}`);
  L.push(`Some os numeradores: ${w?w+'" + ':''}${na}/${D} + ${nb}/${D} = ${w?w+' ':''}${s}/${D}`);
  if(s>=D)L.push(`Passou de uma polegada: ${s}/${D} = ${Math.floor(s/D)}" + ${s%D}/${D} ("vai um")`);
  const r=s%D;if(r&&r%2===0)L.push(`Simplifique: ${cadeia(r,D)}`);
  L.push(`Resultado: <b>${uT(tot)}</b>`);return L}

/* ---------- Explorar ---------- */
const DENS=[2,4,8,16,32,64,128];
function panelExplore(){const A=S.A,B=S.B;
  const grp=(k,f)=>`<div class="grp"><button data-k="${k}" data-v="-1" aria-label="Diminuir numerador">−</button><span class="val">${f.n}</span><button data-k="${k}" data-v="1" aria-label="Aumentar numerador">+</button><span class="bigop">/</span><select data-k="${k}" aria-label="Denominador">${DENS.map(d=>`<option ${d===f.d?'selected':''}>${d}</option>`).join('')}</select></div>`;
  P.innerHTML=`<p style="margin:0">Escolha duas frações e veja a soma passo a passo.</p><div class="pick">${grp('A',A)}<span class="bigop">+</span>${grp('B',B)}</div>
   <div class="big" style="margin-top:14px">${uH(to128(A)+to128(B))}</div><ol class="lista">${resolve(A,B).map(l=>`<li>${l}</li>`).join('')}</ol>`;
  P.querySelectorAll('button[data-k]').forEach(b=>b.onclick=()=>{const f=S[b.dataset.k];f.n=Math.max(1,Math.min(f.d*2-1,f.n+ +b.dataset.v));drawBar(S.A,S.B,true);panelExplore()});
  P.querySelectorAll('select').forEach(s=>s.onchange=()=>{const f=S[s.dataset.k];f.d=+s.value;f.n=Math.max(1,Math.min(f.d*2-1,f.n));drawBar(S.A,S.B,true);panelExplore()});
  drawBar(A,B,true)}

/* ---------- exercícios ---------- */
function gen(){let A,B,k,t=0;
  do{t++;
    if(S.mode==='n1'){const d=pick([4,8,16,16]);A={w:0,n:rnd(1,d-1),d};B={w:0,n:rnd(1,d-1),d};if(Math.random()<.6)while(A.n+B.n>d)B.n=rnd(1,d-1)}
    else if(S.mode==='n2'){const pr=pick([[2,4],[2,8],[4,8],[4,16],[8,16],[2,16],[8,32],[16,32]]);const sw=Math.random()<.5;
      const d1=pr[0],d2=pr[1],a={w:0,n:rnd(1,d1-1)|1,d:d1},b={w:0,n:rnd(1,d2-1),d:d2};if(a.n>=d1)a.n=d1-1;[A,B]=sw?[b,a]:[a,b]}
    else{const tipo=rnd(0,2);
      if(tipo===0){A={w:rnd(0,3),n:rnd(1,15),d:16};B={w:0,n:rnd(1,7),d:128}}            /* escala fixa + nônio */
      else if(tipo===1){A={w:rnd(0,2),n:rnd(1,7)|1,d:8};B={w:rnd(0,1),n:rnd(1,15)|1,d:16}}
      else{A={w:rnd(1,2),n:rnd(1,31)|1,d:32};B={w:0,n:rnd(1,63),d:64}}}
    [A,B].forEach(f=>{const g=gcd(f.n,f.d);if(S.mode!=='n1'&&g>1&&f.n<f.d){f.n/=g;f.d/=g}});
    if(S.mode==='n2'&&A.d===B.d)continue;
    k=mixT(A)+'+'+mixT(B)}while(t<300&&(S.used.has(k)||(S.mode!=='n1'&&A.d===B.d&&S.mode==='n2')));
  S.used.add(k);return[A,B]}
function newRound(){S.answered=false;S.last=null;[S.A,S.B]=gen();drawBar(S.A,S.B,false)}
function startGame(){S.used=new Set();S.played=0;S.round=1;S.score=0;S.correct=0;S.streak=0;S.done=false;newRound();panelGame()}
const key=()=>`soma-frac-${S.mode}`;
function loadBest(){try{S.best=+localStorage.getItem(key())||0}catch(e){S.best=0}}
const stats=()=>`<div class="stats"><span>Rodada<b>${Math.min(S.round,RN())}/${RN()}</b></span><span>Pontos<b>${S.score}</b></span><span>Sequência<b>${S.streak}</b></span><span>Recorde<b>${S.best}</b></span></div>`;
const NOME={n1:'Nível 1',n2:'Nível 2'};
const v=id=>{const e=$(id);if(!e)return null;const x=e.value.trim();return x===''?null:x};
const num=(id)=>{const x=v(id);return x===null?null:/^\d+$/.test(x)?+x:NaN};
const fracBox=(p,lbl)=>`<span class="fin"><input class="n w" id="${p}w" inputmode="numeric" autocomplete="off" aria-label="${lbl}: inteiro"><span class="fstack"><input class="n f" id="${p}n" inputmode="numeric" autocomplete="off" aria-label="${lbl}: numerador"><i></i><input class="n f" id="${p}d" inputmode="numeric" autocomplete="off" aria-label="${lbl}: denominador"></span><span class="unit">"</span></span>`;
const numOver=(id,d,lbl)=>`<span class="fin"><span class="fstack"><input class="n f" id="${id}" inputmode="numeric" autocomplete="off" aria-label="${lbl}"><i></i><span class="fixd">${d}</span></span></span>`;
function readMix(p){const w=num(p+'w'),n=num(p+'n'),d=num(p+'d');if(w===null&&n===null)return null;if([w,n,d].some(x=>Number.isNaN(x)))return{bad:true};
  if(n!==null&&!d)return{bad:true};const W=w||0,N=n||0,Dd=n?d:1;return{u:(W*Dd+N)*128/Dd,simp:N===0||(gcd(N,Dd)===1&&N<Dd),txt:mixT({w:W,n:N,d:Dd})}}

function enunciado(){return `<div class="big" style="font-size:clamp(40px,9vw,64px)">${mixH(S.A)} <span class="bigop">+</span> ${mixH(S.B)} <span class="bigop">= ?</span></div>`}
function passos(){const A=S.A,B=S.B,D=Math.max(A.d,B.d);
  if(S.mode==='n1')return `<div class="passos">
    <div class="passo"><span class="pn">1</span><span class="pt">Some os numeradores (o denominador fica)</span><span class="ex">${A.n} + ${B.n} = ${numOver('s1',D,'Soma dos numeradores')}</span></div>
    <div class="passo"><span class="pn">2</span><span class="pt">Simplifique o resultado</span><span class="ex">= ${fracBox('r','Resultado')}</span></div></div>`;
  if(S.mode==='n2'){const L=Math.log2(D),cel=id=>`<input class="n f" id="${id}" inputmode="numeric" autocomplete="off" aria-label="Tabela do MMC">`;
    let t=`<tr><td>${A.d}</td><td>${B.d}</td><td class="dv">${cel('dv0')}</td></tr>`;
    for(let i=1;i<=L;i++)t+=`<tr><td>${cel('ta'+i)}</td><td>${cel('tb'+i)}</td><td class="dv">${i<L?cel('dv'+i):''}</td></tr>`;
    const linha=(f,id,op)=>`<span class="op">${op}</span><span>${fH(f.n,f.d)}</span><span class="eqs">=</span><span class="fin"><span class="fstack"><input class="n f" id="${id}" inputmode="numeric" autocomplete="off" aria-label="Numerador com o MMC"><i></i><span class="fixd mmcd">?</span></span></span>`;
    return `<div class="passos">
    <div class="passo col"><span class="cab"><span class="pn">1</span><span class="pt">Faça o MMC dos denominadores: divida por 2 até chegar a 1</span></span>
      <table class="mmc" aria-label="Tabela do MMC">${t}</table>
      <div class="mmcres">MMC = <input class="n f" id="mmc" inputmode="numeric" autocomplete="off" aria-label="Resultado do MMC"></div></div>
    <div class="passo col"><span class="cab"><span class="pn">2</span><span class="pt">Monte a conta com o MMC embaixo e some os numeradores</span></span>
      <div class="armada">${linha(A,'s1','')}${linha(B,'s2','+')}<hr><span class="op">=</span><span></span><span></span><span class="fin"><span class="fstack"><input class="n f" id="s3" inputmode="numeric" autocomplete="off" aria-label="Soma dos numeradores"><i></i><span class="fixd mmcd">?</span></span></span></div></div>
    <div class="passo"><span class="pn">3</span><span class="pt">Simplifique o resultado</span><span class="ex">= ${fracBox('r','Resultado')}</span></div></div>`}
  return `<div class="passos"><div class="passo"><span class="pn">=</span><span class="pt">Resultado simplificado</span><span class="ex">${fracBox('r','Resultado')}</span></div></div>`}

function conferir(){const A=S.A,B=S.B,D=Math.max(A.d,B.d),na=A.n*D/A.d,nb=B.n*D/B.d,tot=to128(A)+to128(B);const r=readMix('r');
  const cs=[];
  if(S.mode==='n1'){const s1=num('s1');if(s1===null||Number.isNaN(s1)){$('s1').focus();return}cs.push({t:'Soma dos numeradores',sua:`${s1}/${D}`,ok:s1===na+nb,certa:`${na+nb}/${D}`})}
  let tab=null;
  if(S.mode==='n2'){const L=Math.log2(D),need=['mmc','s1','s2','s3'];for(const id of need){const x=num(id);if(x===null||Number.isNaN(x)){$(id).focus();return}}
    const M=num('mmc'),s1=num('s1'),s2=num('s2'),s3=num('s3');
    tab=[];let tabOk=true;for(let i=0;i<=L;i++){const ea=Math.max(A.d/2**i,1),eb=Math.max(B.d/2**i,1),r=[];
      r.push(i?{v:num('ta'+i),e:ea}:{v:A.d,e:A.d,fixo:1});r.push(i?{v:num('tb'+i),e:eb}:{v:B.d,e:B.d,fixo:1});r.push(i<L?{v:num('dv'+i),e:2}:null);
      r.forEach(c=>{if(c&&!c.fixo&&c.v!==c.e)tabOk=false});tab.push(r)}
    cs.push({t:'Tabela do MMC',ok:tabOk,hide:true});
    cs.push({t:'MMC',sua:`MMC = ${M}`,ok:M===D,certa:`MMC = ${D}`,op:''});
    cs.push({t:'1ª fração',sua:`${A.n}/${A.d} = ${s1}/${M}`,ok:M===D&&s1===na,certa:`${A.n}/${A.d} = ${na}/${D}`,op:''});
    cs.push({t:'2ª fração',sua:`${B.n}/${B.d} = ${s2}/${M}`,ok:M===D&&s2===nb,certa:`${B.n}/${B.d} = ${nb}/${D}`,op:'+'});
    cs.push({t:'Soma',sua:`${s3}/${M}`,ok:M===D&&s3===na+nb,certa:`${na+nb}/${D}`,op:'=',hr:true})}
  if(!r||r.bad){$('rn').focus();return}
  const igual=Math.abs(r.u-tot)<1e-9;cs.push({t:'Resultado',sua:r.txt,ok:igual&&r.simp,certa:uT(tot),falta:igual&&!r.simp,op:'=',hr:S.mode!=='n2'});
  const peso=10/cs.length,pts=Math.round(cs.reduce((a,c)=>a+(c.ok?peso:c.falta?peso*.6:0),0));
  S.answered=true;S.played++;S.score+=pts;const ok=cs.every(c=>c.ok);S.streak=ok?S.streak+1:0;if(ok)S.correct++;S.last={cs,pts,ok,tab};drawBar(A,B,true);panelGame();
  const fb=P.querySelector('.fb');if(fb)fb.scrollIntoView({behavior:'smooth',block:'center'})}

const vis=cs=>cs.filter(c=>!c.hide);
const opOf=(c,i,a)=>c.op!==undefined?c.op:(i===a.length-1?'=':'');
const hrOf=(c,i,a)=>c.hr!==undefined?c.hr:(i===a.length-1&&a.length>1);
function panelGame(){
  if(S.done){const nb=S.score>S.best;if(nb){S.best=S.score;try{localStorage.setItem(key(),S.best)}catch(e){}}
    const jog=S.played||1,max=jog*10,pc=S.score/max*100;
    const msg=pc>=90?'Soma de frações dominada. Pronto para o paquímetro!':pc>=70?'Muito bem. Atenção à simplificação.':pc>=40?'Bom caminho. Lembre: denominadores iguais antes de somar.':'Volte ao modo Explorar e veja a soma passo a passo.';
    P.innerHTML=`<div class="big">${S.score}<small>de ${max} pontos</small></div><p>${NOME[S.mode]} · soma de frações. ${S.correct}/${jog} acertos. ${msg}${nb&&S.score>0?' Novo recorde.':''}</p>
    <div class="row"><button class="act" id="again">Jogar de novo</button><button class="act ghost" id="copyres">Copiar resultado</button><span id="copied" class="copied" style="display:none">Copiado!</span></div>`;
    $('again').onclick=startGame;
    $('copyres').onclick=()=>{const t=`Soma de frações da polegada — ${NOME[S.mode]}: ${S.score}/${max} pontos — ${S.correct}/${jog} acertos — ${new Date().toLocaleDateString('pt-BR')}`;
      (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove()})
      .finally(()=>{const c=$('copied');c.style.display='inline';setTimeout(()=>c.style.display='none',1800)})};
    return}
  let h=stats()+`<span class="task">${{n1:'Mesmo denominador',n2:'Denominadores diferentes: MMC e conta armada'}[S.mode]}</span>`+enunciado();
  if(!S.answered)h+=passos()+`<div class="row"><button class="act" id="ok">Conferir</button></div>`;
  else{const l=S.last,mk=c=>c.ok?'<span class="m ok">✓ certo</span>':c.falta?'<span class="m no">✗ falta simplificar</span>':'<span class="m no">✗ errado</span>';
    h+=`<div class="fb ${l.ok?'ok':'no'}"><strong>${l.ok?'Certo!':l.pts?'Quase.':'Não foi dessa vez.'} +${l.pts}</strong>
     ${l.tab?`<div class="fbt"><span class="tt">Sua tabela do MMC ${l.cs[0].ok?'<span class="m ok" style="background:#17703F;color:#fff;border-radius:12px;padding:3px 9px">✓ certa</span>':'<span class="m no" style="background:#B3261E;color:#fff;border-radius:12px;padding:3px 9px">✗ com erro</span>'}</span><table class="mmc">${l.tab.map(r=>`<tr>${r.map((c,j)=>`<td class="${j===2?'dv ':''}${c&&!c.fixo?(c.v===c.e?'c-ok':'c-no'):''}">${c?(c.v===c.e||c.fixo?c.v:`${c.v===null?'—':c.v} <span style="color:var(--ok);text-decoration:none;display:inline-block">${c.e}</span>`):''}</td>`).join('')}</tr>`).join('')}</table></div>`:''}
     <div class="contas"><div class="conta"><span class="tt">Sua resposta</span>${vis(l.cs).map((c,i,a)=>`${hrOf(c,i,a)?'<hr>':''}<span class="op">${opOf(c,i,a)}</span><span class="v${c.ok?'':' no'}">${c.sua}</span>${mk(c)}`).join('')}</div>
     <div class="conta"><span class="tt">Resposta certa</span>${vis(l.cs).map((c,i,a)=>`${hrOf(c,i,a)?'<hr>':''}<span class="op">${opOf(c,i,a)}</span><span class="v">${c.certa}</span><span class="m">${c.t}</span>`).join('')}</div></div>
     <ol class="lista">${resolve(S.A,S.B).map(x=>`<li>${x}</li>`).join('')}</ol></div>
     <div class="row"><button class="act" id="next">${S.round>=RN()?'Ver resultado':'Próxima'}</button>${S.round<RN()?'<button class="act ghost" id="stop">Terminar agora e ver resultado</button>':''}</div>`}
  h+=`<details class="how"><summary>Como somar frações (passo a passo)</summary><ol>
   <li>Os denominadores (números de baixo) precisam ser iguais. Se não forem, faça o MMC: divida os dois denominadores por 2 até chegar a 1 e multiplique os 2 usados. Ex.: 4 e 16 → 2 × 2 × 2 × 2 = 16. Depois, transforme cada fração: 1/4 = 4/16 (× 4).</li>
   <li>Some só os numeradores (números de cima). O denominador continua o mesmo. Ex.: 4/16 + 3/16 = 7/16.</li>
   <li>Se o numerador ficar maior que o denominador, passou de uma polegada: 10/8 = 1" + 2/8.</li>
   <li>Simplifique: divida em cima e embaixo por 2 enquanto os dois forem pares. Ex.: 2/8 = 1/4.</li></ol></details>`;
  P.innerHTML=h;
  const ok=$('ok');if(ok){ok.onclick=conferir;P.querySelectorAll('input.n').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')ok.click()});const f=P.querySelector('input.n');if(f)f.focus({preventScroll:true})}
  const mm=$('mmc');if(mm)mm.oninput=()=>{const x=mm.value.trim();P.querySelectorAll('.mmcd').forEach(e=>e.textContent=x||'?')};
  if($('stop'))$('stop').onclick=()=>{S.done=true;panelGame()};
  if($('next'))$('next').onclick=()=>{if(S.round>=RN()){S.done=true;panelGame()}else{S.round++;newRound();panelGame()}}}

const mtabs=[...document.querySelectorAll('.tabs button')];
function setMode(m){S.mode=m;S.done=false;S.answered=false;mtabs.forEach(b=>b.setAttribute('aria-selected',b.dataset.m===m));loadBest();
  if(m==='explore'){S.A={w:0,n:1,d:4};S.B={w:0,n:3,d:16};panelExplore()}else startGame()}
mtabs.forEach(b=>b.onclick=()=>setMode(b.dataset.m));
setMode('explore');
</script>
</body>
</html>
