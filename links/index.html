<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Meus Links</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style id="app-style">
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',system-ui,sans-serif;background:#f3f4f6;color:#111827;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;background:#fff;min-height:100vh;padding:28px 20px 60px;position:relative;box-shadow:0 0 40px rgba(0,0,0,.06)}
.topbar{display:flex;justify-content:space-between;margin-bottom:8px}
.iconbtn{width:42px;height:42px;border-radius:14px;border:1px solid #e5e7eb;background:#fff;display:grid;place-items:center;cursor:pointer;color:#111827;font-size:13px;font-family:inherit;font-weight:600}
.iconbtn:hover{background:#f9fafb}
.iconbtn svg{width:18px;height:18px}
.editbtn{width:auto;padding:0 14px;gap:6px;display:flex;align-items:center}
.profile{text-align:center;margin:6px 0 28px}
.avatar{width:96px;height:96px;border-radius:50%;margin:0 auto 14px;background:#111827;color:#fff;display:grid;place-items:center;font-size:36px;font-weight:700;overflow:hidden;border:3px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.avatar img{width:100%;height:100%;object-fit:cover}
.name{font-size:22px;font-weight:700}
.bio{font-size:14px;color:#6b7280;margin-top:4px}
.links{display:flex;flex-direction:column;gap:14px}
.card{display:flex;align-items:center;gap:14px;padding:12px 14px;border:2px solid #111827;border-radius:22px;background:#fff;text-decoration:none;color:inherit;transition:transform .12s,box-shadow .12s;position:relative}
a.card:hover{transform:translateY(-2px);box-shadow:0 6px 0 #111827}
.thumb{width:56px;height:56px;border-radius:16px;flex:none;overflow:hidden;background:#f3f4f6;display:grid;place-items:center;color:#111827}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:28px;height:28px}
.ctext{flex:1;min-width:0;text-align:left}
.ctitle{font-weight:600;font-size:16px;line-height:1.3}
.csub{font-size:13px;color:#2563eb;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.more{width:34px;height:34px;border-radius:50%;border:none;background:transparent;cursor:pointer;color:#6b7280;display:grid;place-items:center;flex:none}
.more:hover{background:#f3f4f6;color:#111827}
.more svg{width:18px;height:18px}
.empty{text-align:center;color:#9ca3af;font-size:14px;padding:20px}
.foot{text-align:center;margin-top:40px;font-size:12px;color:#9ca3af}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* editor */
.ed{border:2px dashed #d1d5db;border-radius:22px;padding:14px;background:#fafafa;display:flex;flex-direction:column;gap:10px}
.edrow{display:flex;gap:12px;align-items:center}
.ed label{font-size:12px;font-weight:600;color:#374151;display:block;margin-bottom:3px}
.ed input[type=text]{width:100%;padding:9px 12px;border:1px solid #d1d5db;border-radius:12px;font:inherit;font-size:14px;background:#fff}
.ed input[type=text]:focus{outline:2px solid #111827;border-color:transparent}
.imgpick{width:64px;height:64px;border-radius:16px;border:2px dashed #9ca3af;background:#fff;display:grid;place-items:center;cursor:pointer;overflow:hidden;flex:none;font-size:11px;color:#6b7280;text-align:center;line-height:1.2;padding:0}
.imgpick img{width:100%;height:100%;object-fit:cover}
.edactions{display:flex;gap:8px;flex-wrap:wrap}
.sbtn{padding:7px 12px;border-radius:10px;border:1px solid #d1d5db;background:#fff;font:inherit;font-size:13px;cursor:pointer}
.sbtn:hover{background:#f3f4f6}
.sbtn.danger{color:#b91c1c;border-color:#fecaca}
.sbtn.primary{background:#111827;color:#fff;border-color:#111827}
.sbtn.primary:hover{background:#1f2937}
.addbtn{border:2px dashed #111827;border-radius:22px;padding:16px;background:#fff;font:inherit;font-weight:600;font-size:15px;cursor:pointer}
.addbtn:hover{background:#f9fafb}
.savebar{position:sticky;bottom:12px;margin-top:20px;background:#111827;color:#fff;border-radius:18px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.savebar span{font-size:13px}
.savebar .sbtn{border:none}
.avatarpick{margin:0 auto 10px;width:96px;height:96px;border-radius:50%}
.msg{font-size:13px;color:#b91c1c;text-align:center;margin-top:8px}
</style>
</head>

}
function thumbHtml(l){
  const img=safeImg(l.img);
  if(img) return '<img alt="" src="'+img+'">';
  return /^mailto:/i.test(l.url||'') ? ICONS.mail : ICONS.link;
}
function displayUrl(u){return (u||'').replace(/^mailto:/i,'').replace(/^https?:\/\//i,'');}

/* ---------- view mode ---------- */
function renderView(){
  const p=state.profile, av=safeImg(p.avatar);
  let h='<div class="topbar">';
  h+= canEdit ? '<button class="iconbtn editbtn" id="editBtn" title="Editar página">'+ICONS.pen+' Editar</button>' : '<span></span>';
  h+='<button class="iconbtn" id="shareBtn" title="Copiar link da página">'+ICONS.share+'</button></div>';
  h+='<div class="profile"><div class="avatar">'+(av?'<img alt="" src="'+av+'">':esc(initials(p.name)))+'</div>';
  h+='<div class="name">'+esc(p.name)+'</div>'+(p.bio?'<div class="bio">'+esc(p.bio)+'</div>':'')+'</div>';
  h+='<div class="links">';
  const ls=state.links||[];
  if(!ls.length) h+='<div class="empty">Nenhum link ainda.</div>';
  ls.forEach(l=>{
    const url=normUrl(l.url);
    const sub=l.text||displayUrl(url);
    const inner='<div class="thumb">'+thumbHtml(l)+'</div><div class="ctext"><div class="ctitle">'+esc(l.title||'Sem título')+'</div>'+(sub?'<div class="csub">'+esc(sub)+'</div>':'')+'</div>'+
      (url?'<button class="more" data-copy="'+esc(url.replace(/^mailto:/i,''))+'" title="Copiar link">'+ICONS.dots+'</button>':'');
    h+= url ? '<a class="card" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+inner+'</a>' : '<div class="card">'+inner+'</div>';
  });
  h+='</div><div class="foot">'+esc(p.name)+'</div>';
  const root=document.getElementById('root'); root.innerHTML=h;
  const eb=document.getElementById('editBtn'); if(eb) eb.onclick=startEdit;
  document.getElementById('shareBtn').onclick=()=>{let u='';try{u=window.top.location.href;}catch(e){u=location.href;}copy(u);};
  root.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();copy(b.getAttribute('data-copy'));}));
}

/* ---------- edit mode ---------- */
function startEdit(){draft=JSON.parse(JSON.stringify(state));editing=true;renderEdit();}
function renderEdit(msg){
  const p=draft.profile, av=safeImg(p.avatar);
  let h='<div class="profile ed" style="text-align:left">';
  h+='<button class="imgpick avatarpick" data-img="avatar" title="Trocar foto">'+(av?'<img alt="" src="'+av+'">':'Foto do<br>perfil')+'</button>';
  if(av) h+='<div style="text-align:center"><button class="sbtn" data-rmavatar="1">Remover foto</button></div>';
  h+='<div><label>Nome</label><input type="text" data-p="name" value="'+esc(p.name)+'"></div>';
  h+='<div><label>Frase abaixo do nome</label><input type="text" data-p="bio" value="'+esc(p.bio)+'"></div></div>';
  h+='<div class="links">';
  draft.links.forEach((l,i)=>{
    const img=safeImg(l.img);
    h+='<div class="ed" data-i="'+i+'"><div class="edrow">'+
      '<button class="imgpick" data-img="'+i+'" title="Escolher imagem">'+(img?'<img alt="" src="'+img+'">':'Escolher<br>imagem')+'</button>'+
      '<div style="flex:1"><label>Título (em cima)</label><input type="text" data-f="title" value="'+esc(l.title)+'" placeholder="Ex.: E-mail"></div></div>'+
      '<div><label>Texto de baixo (opcional)</label><input type="text" data-f="text" value="'+esc(l.text)+'" placeholder="Ex.: meuemail@gmail.com"></div>'+
      '<div><label>Link (site ou e-mail)</label><input type="text" data-f="url" value="'+esc(l.url)+'" placeholder="https://... ou nome@email.com"></div>'+
      '<div class="edactions">'+
        '<button class="sbtn" data-mv="-1"'+(i===0?' disabled':'')+'>↑ Subir</button>'+
        '<button class="sbtn" data-mv="1"'+(i===draft.links.length-1?' disabled':'')+'>↓ Descer</button>'+
        (img?'<button class="sbtn" data-rmimg="1">Tirar imagem</button>':'')+
        '<button class="sbtn danger" data-del="1">Excluir</button>'+
      '</div></div>';
  });
  h+='<button class="addbtn" id="addBtn">+ Adicionar link</button></div>';
  h+='<div class="savebar"><span>Modo edição</span><div class="edactions"><button class="sbtn" id="cancelBtn">Cancelar</button><button class="sbtn primary" id="saveBtn" style="background:#fff;color:#111827">Salvar</button></div></div>';
  if(msg) h+='<div class="msg">'+esc(msg)+'</div>';
  const root=document.getElementById('root'); root.innerHTML=h;

  root.querySelectorAll('[data-p]').forEach(inp=>inp.addEventListener('input',()=>{draft.profile[inp.dataset.p]=inp.value;}));
  root.querySelectorAll('.ed[data-i]').forEach(box=>{
    const i=+box.dataset.i;
    box.querySelectorAll('[data-f]').forEach(inp=>inp.addEventListener('input',()=>{draft.links[i][inp.dataset.f]=inp.value;}));
    const mv=box.querySelectorAll('[data-mv]');
    mv.forEach(b=>b.onclick=()=>{const d=+b.dataset.mv,j=i+d;if(j<0||j>=draft.links.length)return;const t=draft.links[i];draft.links[i]=draft.links[j];draft.links[j]=t;renderEdit();});
    const del=box.querySelector('[data-del]'); del.onclick=()=>{draft.links.splice(i,1);renderEdit();};
    const rm=box.querySelector('[data-rmimg]'); if(rm) rm.onclick=()=>{draft.links[i].img='';renderEdit();};
  });
  const rma=root.querySelector('[data-rmavatar]'); if(rma) rma.onclick=()=>{draft.profile.avatar='';renderEdit();};
  root.querySelectorAll('[data-img]').forEach(b=>b.onclick=()=>pickImage(b.dataset.img));
  document.getElementById('addBtn').onclick=()=>{draft.links.push({id:'l'+Date.now(),title:'',text:'',url:'',img:''});renderEdit();
    const last=document.querySelectorAll('.ed[data-i]');const el=last[last.length-1];if(el){el.scrollIntoView({behavior:'smooth',block:'center'});const f=el.querySelector('[data-f=title]');if(f)f.focus();}};
  document.getElementById('cancelBtn').onclick=()=>{editing=false;draft=null;renderView();};
  document.getElementById('saveBtn').onclick=save;
}

function pickImage(target){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=()=>{const f=inp.files&&inp.files[0];if(!f)return;
    const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
      const S=target==='avatar'?240:160;const c=document.createElement('canvas');c.width=S;c.height=S;const x=c.getContext('2d');
      const m=Math.min(im.width,im.height);x.fillStyle='#fff';x.fillRect(0,0,S,S);
      x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,S,S);
      const data=c.toDataURL('image/jpeg',0.85);
      if(target==='avatar') draft.profile.avatar=data; else draft.links[+target].img=data;
      renderEdit();
    };im.onerror=()=>toast('Não consegui abrir essa imagem');im.src=r.result;};r.readAsDataURL(f);};
  inp.click();
}

function buildDoc(s){
  const style=document.getElementById('app-style').textContent;
  const code=document.getElementById('app-code').textContent;
  const json=JSON.stringify(s).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n<html lang="pt-BR">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>Meus Links</title>\n'+
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">\n'+
    '<style id="app-style">'+style+'</style>\n</head>\n<body>\n'+SHELL_BODY+
    '<script id="app-state" type="application/json">'+json+'<\/script>\n'+
    '<script id="app-code">'+code+'<\/script>\n</body>\n</html>\n';
}

async function save(){
  const clean={profile:{name:(draft.profile.name||'').trim()||'Meu nome',bio:(draft.profile.bio||'').trim(),avatar:safeImg(draft.profile.avatar)},
    links:draft.links.map(l=>({id:l.id,title:(l.title||'').trim(),text:(l.text||'').trim(),url:normUrl(l.url),img:safeImg(l.img)}))};
  if(!artifactApi){ renderEdit('Não foi possível salvar aqui. Abra a página pelo link do Claude, logado na sua conta.'); return; }
  const btn=document.getElementById('saveBtn'); if(btn){btn.disabled=true;btn.textContent='Salvando...';}
  try{
    await artifactApi.publish(buildDoc(clean));
    state=clean; editing=false; draft=null; renderView(); toast('Salvo!');
  }catch(e){
    const code=(e&&(e.code||e.name||e.message))||'';
    if(/not_writer|not_granted/.test(code)){ canEdit=false; editing=false; renderView(); toast('Só o dono da página pode editar'); }
    else if(/conflict/.test(code)){ toast('A página foi atualizada em outro lugar'); }
    else renderEdit('Não foi possível salvar. Tente de novo.');
  }
}

renderView();
if(window.claude && typeof window.claude.use==='function'){
  Promise.all([window.claude.use('artifact').catch(()=>null),window.claude.use('user').catch(()=>null)]).then(([a,u])=>{
    artifactApi=a;
    let ok=false; try{ ok=!!(a && u && (u.isOwner() || u.canEdit())); }catch(e){}
    if(ok && !canEdit){ canEdit=true; if(!editing) renderView(); }
  });
}
})();
</script>
</body>
</html>
