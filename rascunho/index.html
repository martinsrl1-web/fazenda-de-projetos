<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Folha de rascunho</title>
<style>
/* VOICE: calma, objeto de papelaria
   IDEA: uma folha de caderno pautada
   PICTURE: a própria folha ocupa a tela
   COLOUR and TYPE: papel branco, linhas azuis, margem vermelha; fonte do sistema
   LAYOUT: folha inteira + barra de ferramentas flutuante embaixo */
:root{color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#fdfdfb;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
#folha{position:fixed;inset:0;
  background:
   linear-gradient(90deg,transparent 63px,#e57373 63px,#e57373 65px,transparent 65px),
   repeating-linear-gradient(180deg,transparent 0,transparent 35px,#b9d3ec 35px,#b9d3ec 36px);
  background-position:0 0,0 60px;background-color:#fdfdfb}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.barra{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;padding:6px;background:#2b2b2b;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:2}
.barra button{display:flex;align-items:center;gap:8px;min-height:52px;padding:0 18px;border:0;border-radius:999px;background:transparent;color:#eee;font:600 16px system-ui,sans-serif;cursor:pointer}
.barra button svg{width:26px;height:26px}
.barra button.ativo{background:#fff;color:#1b1b1b}
.barra button:focus-visible{outline:3px solid #6aa9ff;outline-offset:2px}
.barra .sep{width:1px;background:#555;margin:8px 2px}
.barra .peq{padding:0 14px}
#confirma{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.35);z-index:3}
#confirma.on{display:flex}
#confirma div{background:#fff;padding:22px;border-radius:16px;max-width:320px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#confirma p{margin:0 0 16px;font-size:17px}
#confirma button{min-height:48px;padding:0 20px;margin:0 4px;border-radius:12px;border:1px solid #ccc;background:#f3f3f3;font:600 16px system-ui,sans-serif}
#confirma button.sim{background:#c62828;border-color:#c62828;color:#fff}
@media(max-width:520px){.barra button .txt{display:none}.barra button{padding:0 14px}}
.calc{position:fixed;right:16px;bottom:max(16px,env(safe-area-inset-bottom));width:236px;background:#2b2b2b;border-radius:18px;padding:10px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:2}
.calc.fechada{display:none}
.visor{background:#f4f4ef;color:#1b1b1b;border-radius:10px;padding:6px 10px 8px;text-align:right;margin-bottom:8px}
.visor .conta{font-size:13px;color:#777;min-height:18px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.visor .res{font:600 26px/1.2 system-ui,sans-serif;overflow:hidden;white-space:nowrap;direction:rtl;text-align:right}
.visor .res span{direction:ltr;unicode-bidi:embed}
.teclas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.teclas button{height:44px;border:0;border-radius:10px;background:#444;color:#fff;font:600 19px system-ui,sans-serif;cursor:pointer}
.teclas button:active{filter:brightness(1.3)}
.teclas .op{background:#4f74a6}
.teclas .lim{background:#666}
.teclas .ig{background:#d9534f;grid-row:span 2;height:auto}
.teclas .zero{grid-column:span 2}
@media(max-width:820px){.calc{right:auto;left:50%;transform:translateX(-50%);bottom:calc(max(16px,env(safe-area-inset-bottom)) + 140px)}}
.calc.movida{transform:none!important;right:auto!important;bottom:auto!important}
.alca{height:26px;margin:-6px -6px 6px;display:flex;justify-content:center;align-items:center;cursor:grab;touch-action:none;border-radius:12px}
.alca:active{cursor:grabbing}
.alca span{width:48px;height:5px;border-radius:3px;background:#8a8a8a}
.tamanhos{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(16px,env(safe-area-inset-bottom)) + 74px);display:none;gap:4px;padding:6px;background:#2b2b2b;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:2;align-items:center}
.tamanhos.on{display:flex}
.tamanhos button{width:52px;height:52px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;cursor:pointer}
.tamanhos button i{display:block;border-radius:50%;background:#bdbdbd}
.tamanhos button.ativo{background:#fff}
.tamanhos button.ativo i{background:#1b1b1b}
.tamanhos button:focus-visible{outline:3px solid #6aa9ff;outline-offset:2px}
#mira{position:fixed;left:0;top:0;pointer-events:none;border:1.5px solid #666;border-radius:50%;background:rgba(255,255,255,.35);display:none;z-index:1;transform:translate(-50%,-50%)}
</style>
</head>
<body>
<div id="folha"></div>
<canvas id="tela"></canvas>

<div class="barra" role="toolbar" aria-label="Ferramentas">
  <button id="lapis" class="ativo" aria-pressed="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 20l1-5L16 4l4 4L9 19z"/><path d="M14 6l4 4"/><path d="M4 20l5-1"/></svg>
    <span class="txt">Lápis</span>
  </button>
  <button id="borracha" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M8 20h12"/><path d="M3.5 14.5l9-9a2 2 0 0 1 2.8 0l3.2 3.2a2 2 0 0 1 0 2.8L11 19H8z"/><path d="M8.5 9.5l6 6"/></svg>
    <span class="txt">Borracha</span>
  </button>
  <span class="sep"></span>
  <button id="desfazer" class="peq" aria-label="Desfazer">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
  </button>
  <button id="limpar" class="peq" aria-label="Limpar a folha">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>
  </button>
  <span class="sep"></span>
  <button id="bcalc" class="peq ativo" aria-label="Mostrar ou esconder a calculadora" aria-pressed="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8"/><path d="M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/></svg>
  </button>
</div>

<div class="tamanhos" id="tamanhos" role="group" aria-label="Tamanho da borracha">
  <button data-t="18" aria-label="Borracha pequena"><i style="width:8px;height:8px"></i></button>
  <button data-t="40" class="ativo" aria-label="Borracha média"><i style="width:15px;height:15px"></i></button>
  <button data-t="75" aria-label="Borracha grande"><i style="width:24px;height:24px"></i></button>
  <button data-t="130" aria-label="Borracha muito grande"><i style="width:36px;height:36px"></i></button>
</div>
<div id="mira"></div>

<div class="calc" id="calc" aria-label="Calculadora">
  <div class="alca" id="alca" title="Arraste para mover a calculadora"><span></span></div>
  <div class="visor"><div class="conta" id="conta"></div><div class="res"><span id="res">0</span></div></div>
  <div class="teclas" id="teclas">
    <button class="lim" data-k="C">C</button><button class="lim" data-k="B" aria-label="Apagar último">⌫</button><button class="op" data-k="/">÷</button><button class="op" data-k="*">×</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="op" data-k="-">−</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button class="op" data-k="+">+</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button class="ig" data-k="=">=</button>
    <button class="zero" data-k="0">0</button><button data-k=".">,</button>
  </div>
</div>

<div id="confirma"><div>
  <p>Apagar tudo o que está na folha?</p>
  <button id="nao">Cancelar</button><button id="sim" class="sim">Apagar tudo</button>
</div></div>

<script>
{
const c=document.getElementById('tela'),ctx=c.getContext('2d');
const bL=document.getElementById('lapis'),bB=document.getElementById('borracha');
let ferramenta='lapis',desenhando=false,ultimo=null,usouCaneta=false,tamBorracha=40;
const tams=document.getElementById('tamanhos'),mira=document.getElementById('mira');
function mostrarMira(e){
  if(ferramenta!=='borracha'){mira.style.display='none';return}
  mira.style.display='block';mira.style.width=mira.style.height=tamBorracha+'px';
  mira.style.left=e.clientX+'px';mira.style.top=e.clientY+'px';
}
const historico=[];const CHAVE='rascunho-folha';

function tamanho(){
  const dpr=window.devicePixelRatio||1;
  const img=c.width?c.toDataURL():null;
  c.width=Math.round(innerWidth*dpr);c.height=Math.round(innerHeight*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(img)desenharImagem(img);
}
function desenharImagem(src){
  const i=new Image();i.onload=()=>{ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='source-over';ctx.drawImage(i,0,0);ctx.restore()};i.src=src;
}
function salvar(){try{localStorage.setItem(CHAVE,c.toDataURL())}catch(e){}}
function guardarEstado(){
  historico.push(ctx.getImageData(0,0,c.width,c.height));
  if(historico.length>30)historico.shift();
}
function escolher(f){
  ferramenta=f;
  bL.classList.toggle('ativo',f==='lapis');bB.classList.toggle('ativo',f==='borracha');
  bL.setAttribute('aria-pressed',f==='lapis');bB.setAttribute('aria-pressed',f==='borracha');
  tams.classList.toggle('on',f==='borracha');
  if(f!=='borracha')mira.style.display='none';
}
tams.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  tamBorracha=+b.dataset.t;
  for(const x of tams.children)x.classList.toggle('ativo',x===b);
});
function espessura(e){
  const p=(e.pointerType==='pen'&&e.pressure>0)?e.pressure:0.5;
  return ferramenta==='lapis'?1.2+p*2.6:tamBorracha;
}
function inicio(e){
  if(e.pointerType==='pen')usouCaneta=true;
  if(usouCaneta&&e.pointerType==='touch')return; /* ignora a palma da mão quando usa caneta */
  if(e.button>0)return;
  c.setPointerCapture(e.pointerId);
  guardarEstado();desenhando=true;ultimo={x:e.offsetX,y:e.offsetY};
  ponto(e);
}
function ponto(e){
  ctx.globalCompositeOperation=ferramenta==='borracha'?'destination-out':'source-over';
  ctx.fillStyle='#2a2a2a';
  ctx.beginPath();ctx.arc(e.offsetX,e.offsetY,espessura(e)/2,0,Math.PI*2);ctx.fill();
}
function mover(e){
  if(!desenhando)return;
  const lista=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  for(const p of lista){
    const x=p.offsetX,y=p.offsetY;
    ctx.globalCompositeOperation=ferramenta==='borracha'?'destination-out':'source-over';
    ctx.strokeStyle='#2a2a2a';ctx.lineWidth=espessura(p);ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(ultimo.x,ultimo.y);ctx.lineTo(x,y);ctx.stroke();
    ultimo={x,y};
  }
}
function fim(){if(desenhando){desenhando=false;salvar()}}

c.addEventListener('pointerdown',e=>{mostrarMira(e);inicio(e)});
c.addEventListener('pointermove',e=>{mostrarMira(e);mover(e)});
c.addEventListener('pointerup',e=>{fim();if(e.pointerType!=='mouse')mira.style.display='none'});
c.addEventListener('pointercancel',()=>{fim();mira.style.display='none'});
c.addEventListener('pointerleave',()=>{mira.style.display='none'});
c.addEventListener('contextmenu',e=>e.preventDefault());
bL.addEventListener('click',()=>escolher('lapis'));
bB.addEventListener('click',()=>escolher('borracha'));
document.getElementById('desfazer').addEventListener('click',()=>{
  const s=historico.pop();if(s){ctx.putImageData(s,0,0);salvar()}
});
const caixa=document.getElementById('confirma');
document.getElementById('limpar').addEventListener('click',()=>caixa.classList.add('on'));
document.getElementById('nao').addEventListener('click',()=>caixa.classList.remove('on'));
document.getElementById('sim').addEventListener('click',()=>{
  guardarEstado();ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,c.width,c.height);ctx.restore();
  salvar();caixa.classList.remove('on');
});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();document.getElementById('desfazer').click()}
});
document.addEventListener('touchmove',e=>{if(e.target===c)e.preventDefault()},{passive:false});

/* ---- calculadora ---- */
const elConta=document.getElementById('conta'),elRes=document.getElementById('res');
const painel=document.getElementById('calc'),bC=document.getElementById('bcalc');
let expr='',calculado=false;
const OPS='+-*/';
const bonito=s=>s.replace(/\*/g,'×').replace(/\//g,'÷').replace(/-/g,'−').replace(/\./g,',');
function fmt(n){return parseFloat(n.toPrecision(12)).toLocaleString('pt-BR',{maximumFractionDigits:10})}
function calcular(s){
  const tk=[];let i=0;
  while(i<s.length){
    const ch=s[i];
    if(OPS.includes(ch)&&!(ch==='-'&&(tk.length===0||typeof tk[tk.length-1]==='string'))){tk.push(ch);i++;continue}
    let j=i+(ch==='-'?1:0);while(j<s.length&&/[0-9.]/.test(s[j]))j++;
    const n=parseFloat(s.slice(i,j));if(isNaN(n))return NaN;tk.push(n);i=j;
  }
  if(typeof tk[tk.length-1]==='string')tk.pop();
  const a=[tk[0]];
  for(let k=1;k<tk.length;k+=2){
    const op=tk[k],n=tk[k+1];
    if(op==='*')a[a.length-1]*=n;
    else if(op==='/'){if(n===0)return NaN;a[a.length-1]/=n}
    else a.push(op,n);
  }
  let r=a[0];for(let k=1;k<a.length;k+=2)r=a[k]==='+'?r+a[k+1]:r-a[k+1];
  return r;
}
function mostrar(){elRes.textContent=expr?bonito(expr):'0'}
function tecla(k){
  const ult=expr.slice(-1);
  if(/[0-9]/.test(k)){if(calculado){expr='';calculado=false}expr+=k}
  else if(k==='.'){
    if(calculado){expr='';calculado=false}
    const atual=expr.split(/[+*\/]|(?<=\d)-/).pop();
    if(!atual.includes('.'))expr+=(atual===''||atual==='-')?'0.':'.';
  }
  else if(OPS.includes(k)){
    calculado=false;
    if(expr===''||expr==='-'){if(k==='-')expr='-';}
    else if(OPS.includes(ult))expr=expr.slice(0,-1)+k;
    else expr+=k;
  }
  else if(k==='='){
    if(!expr||expr==='-')return;
    const r=calcular(expr);
    elConta.textContent=bonito(expr.replace(/[+\-*\/]$/,''))+' =';
    if(!isFinite(r)){elRes.textContent='Erro';expr='';calculado=true;return}
    const limpo=parseFloat(r.toPrecision(12));
    expr=String(limpo);calculado=true;elRes.textContent=fmt(limpo);return;
  }
  else if(k==='C'){expr='';elConta.textContent='';calculado=false}
  else if(k==='B'){if(calculado){expr='';calculado=false}else expr=expr.slice(0,-1)}
  mostrar();
}
document.getElementById('teclas').addEventListener('click',e=>{const b=e.target.closest('button');if(b)tecla(b.dataset.k)});
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||painel.classList.contains('fechada'))return;
  const m={Enter:'=','=':'=',Backspace:'B',Escape:'C',',':'.','.':'.',x:'*',X:'*'};
  const k=/^[0-9+\-*\/]$/.test(e.key)?e.key:m[e.key];
  if(k){e.preventDefault();tecla(k)}
});
function abrirCalc(on){
  painel.classList.toggle('fechada',!on);bC.classList.toggle('ativo',on);bC.setAttribute('aria-pressed',on);
  try{localStorage.setItem('rascunho-calc',on?'1':'0')}catch(e){}
}
bC.addEventListener('click',()=>abrirCalc(painel.classList.contains('fechada')));
try{if(localStorage.getItem('rascunho-calc')==='0')abrirCalc(false)}catch(e){}

/* mover a calculadora pela alça */
const alca=document.getElementById('alca');let arraste=null;
function posicionar(x,y){
  const w=painel.offsetWidth,h=painel.offsetHeight;
  x=Math.max(0,Math.min(x,innerWidth-w));y=Math.max(0,Math.min(y,innerHeight-h));
  painel.style.left=x+'px';painel.style.top=y+'px';
}
alca.addEventListener('pointerdown',e=>{
  e.preventDefault();alca.setPointerCapture(e.pointerId);
  const r=painel.getBoundingClientRect();
  arraste={dx:e.clientX-r.left,dy:e.clientY-r.top};
  painel.classList.add('movida');posicionar(r.left,r.top);
});
alca.addEventListener('pointermove',e=>{if(arraste)posicionar(e.clientX-arraste.dx,e.clientY-arraste.dy)});
function soltar(){
  if(!arraste)return;arraste=null;
  try{localStorage.setItem('rascunho-calc-pos',JSON.stringify([parseFloat(painel.style.left),parseFloat(painel.style.top)]))}catch(e){}
}
alca.addEventListener('pointerup',soltar);alca.addEventListener('pointercancel',soltar);
try{const p=JSON.parse(localStorage.getItem('rascunho-calc-pos'));if(Array.isArray(p)){painel.classList.add('movida');posicionar(p[0],p[1])}}catch(e){}
addEventListener('resize',()=>{if(painel.classList.contains('movida'))posicionar(parseFloat(painel.style.left)||0,parseFloat(painel.style.top)||0)});
bC.addEventListener('click',()=>{if(painel.classList.contains('movida')&&!painel.classList.contains('fechada'))posicionar(parseFloat(painel.style.left)||0,parseFloat(painel.style.top)||0)});

let t;addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(tamanho,150)});
tamanho();
try{const s=localStorage.getItem(CHAVE);if(s)desenharImagem(s)}catch(e){}
}
</script>
</body>
</html>
